<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back office work</title>
<!-- A clickable design for the back office (docs/design/workflows.html, docs/cases-plan.md):
     one to-do list (Your call); Sales (New accounts and Expansion) and Build (Issues, Agent builds,
     Enhancements), each one sidebar item with tabs that open on the one list; the client page and
     Autopilot. Built on the design system's app patterns (KPIs, page tabs, filters, sticky data head,
     due dates, board heads with totals). Not wired to anything: every name and number is made up.
     Serve the repo root over http and open /docs/design/pipelines.html. -->
<link rel="stylesheet" href="../../packages/design-system/tokens.css">
<link rel="stylesheet" href="../../packages/design-system/components/bundle.css">
<link rel="icon" href="../../packages/design-system/assets/Logos/favicon.svg">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 400 14px/1.45 var(--font-sans); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; }
  .ic { width: 16px; height: 16px; flex: none; color: currentColor; stroke: currentColor; fill: none; }
  .ic--20 { width: 20px; height: 20px; }

  /* Shell */
  .shell { display: grid; grid-template-rows: var(--header-h) 1fr; height: 100vh; }
  .ds-header { position: sticky; top: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: var(--space-3); }
  .brand img { height: 18px; display: block; }
  .brand .place { font: 500 13px/1 var(--font-sans); color: var(--ink-muted); padding-left: var(--space-3); border-left: 1px solid var(--line); }
  .brand .logo-dark { display: none; }
  :root[data-theme="dark"] .brand .logo-dark { display: block; }
  :root[data-theme="dark"] .brand .logo-light { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand .logo-dark { display: block; }
    :root:not([data-theme="light"]) .brand .logo-light { display: none; }
  }
  .search { flex: 1; max-width: 520px; display: flex; align-items: center; gap: var(--space-2); height: 34px; padding: 0 var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper); color: var(--ink-faint); font-size: 13px; }
  .search kbd { margin-left: auto; font: 500 11px/1 var(--font-mono); color: var(--ink-muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); }
  .body { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 0; }
  .ds-sidebar { overflow-y: auto; }
  .nav-section { margin: var(--space-4) 0 var(--space-1); padding: 0 10px; }
  .ds-navitem { gap: var(--space-2); text-decoration: none; }
  .ds-navitem:hover { text-decoration: none; }
  .ds-navitem .lbl { display: flex; align-items: center; gap: var(--space-2-5); }
  .ds-navitem .ic { opacity: var(--icon-opacity); }
  .ds-navitem[aria-current="page"] { background: var(--slate-tint); color: var(--slate); font-weight: 500; }
  .ds-navitem[aria-current="page"] .ic { opacity: 1; }
  .ds-navitem.inert { color: var(--ink-muted); }
  .count { font: 500 11px/1 var(--font-sans); padding: 3px 7px; border-radius: var(--radius-pill); background: var(--surface-subtle); color: var(--ink-muted); }
  .count--you { background: var(--signal); color: var(--ink); }
  .main { overflow-y: auto; min-width: 0; }
  .page { padding: var(--space-8) var(--space-10) var(--space-16); max-width: 1440px; }
  .page--wide { max-width: none; padding-right: 0; }
  @media (max-width: 900px) {
    .body { grid-template-columns: 1fr; }
    .ds-sidebar { display: none; }
    .page { padding: var(--space-6) var(--space-4) var(--space-12); }
    .search { display: none; }
    .brand .place { display: none; }
    .ds-header { gap: var(--space-2); }
  }

  /* Page heads */
  .crumbs { display: flex; gap: var(--space-2); align-items: center; font-size: 13px; color: var(--ink-muted); margin-bottom: var(--space-2); }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); }
  .page-head h1 { margin: 0; font: 500 28px/34px var(--font-sans); letter-spacing: -0.02em; }
  .page-head p { margin: var(--space-1) 0 0; color: var(--ink-muted); font-size: 15px; }
  .row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .grow { flex: 1; }
  .muted { color: var(--ink-muted); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; }
  .mono { font-family: var(--font-mono); }
  .num { font-variant-numeric: tabular-nums; }
  hr.sep { border: 0; border-top: 1px solid var(--line); margin: var(--space-4) 0; }

  /* Section pages: tabs, KPIs that scroll away, then a data head that sticks */
  .page--full { max-width: none; }
  .page-tabs { margin-bottom: var(--space-5); overflow-x: auto; scrollbar-width: none; }
  .page-tabs a { flex: none; }
  .rec > * { min-width: 0; }
  .ds-kpis { margin-bottom: var(--space-5); }
  .ds-tabs a .count { margin-left: 2px; }
  .dt--page { margin-bottom: var(--space-6); }
  .dt--page .dt-bar { gap: var(--space-3); }
  .dt--page table td { padding: var(--space-2-5) var(--space-3); border-bottom: 1px solid var(--line); vertical-align: top; }
  .dt--page table th { height: 34px; padding: 0 var(--space-3); }
  .dt--page table th:first-child, .dt--page table td:first-child { padding-left: var(--space-4); }
  .dt--page table th:last-child, .dt--page table td:last-child { padding-right: var(--space-4); }
  .dt--page tbody tr:hover td { background: var(--surface-subtle); cursor: pointer; }
  .dt--page tbody tr.is-moved td { background: var(--slate-tint); }
  .dt--page tbody tr.is-done td { color: var(--ink-muted); }
  .cell-title { font-weight: 500; color: var(--ink); }
  .cell-desc { display: block; margin-top: 3px; max-width: 46ch; font-size: 12px; line-height: 1.4; color: var(--ink-muted); }
  .cell-why { display: block; margin-top: 3px; font-size: 12px; color: var(--ink-muted); }
  .rank { font: 500 12px/1 var(--font-mono); color: var(--ink-muted); }
  .dt-wrap { min-width: 0; }
  .stage-mini { font-size: 13px; }
  .stage-mini small { display: block; font-size: 11px; color: var(--ink-muted); }
  @media (max-width: 900px) {
    .dt-wrap { overflow-x: auto; }
    .dt--page .dt-bar { height: auto; flex-wrap: wrap; padding: var(--space-2) var(--space-3); }
    .dt--page thead th { position: static; }
    .ds-datahead { position: static; }
  }
  /* Your call: the same freeze, for the to-do list */
  .stickybar { position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-3) 0; margin-bottom: var(--space-3); background: var(--paper); border-bottom: 1px solid var(--line); }
  .stickybar .ds-filters { flex: 1; min-width: 0; }
  .stickybar .dt-search { width: 160px; }
  .call-meta { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; margin-top: var(--space-2); font-size: 12px; color: var(--ink-muted); }
  .pipe-tag { display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); }

  /* Your call */
  .call-list { display: flex; flex-direction: column; gap: var(--space-3); }
  .call { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
  .call.is-focus { border-color: var(--slate); box-shadow: 0 0 0 1px var(--slate); }
  .call.is-done { opacity: .5; }
  .call__main { padding: var(--space-4) var(--space-5); min-width: 0; }
  .call__side { padding: var(--space-4) var(--space-5); border-left: 1px solid var(--line); background: var(--surface-subtle); display: flex; flex-direction: column; gap: var(--space-3); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .call h3 { margin: var(--space-1-5) 0 var(--space-1); font: 500 16px/22px var(--font-sans); }
  .call h3 a { color: var(--ink); }
  .read { margin: var(--space-2) 0 0; font-size: 14px; line-height: 1.55; }
  .why { display: flex; gap: var(--space-2); align-items: flex-start; margin-top: var(--space-3); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); background: var(--signal-tint); color: var(--signal-ink); font-size: 13px; }
  .why b { font-weight: 500; }
  .draft { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--space-3); font-size: 13px; line-height: 1.55; white-space: pre-line; max-height: 168px; overflow: hidden; position: relative; }
  .draft::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 32px; background: linear-gradient(transparent, var(--surface)); }
  .draft.open { max-height: none; }
  .draft.open::after { display: none; }
  .draft-to { font-size: 12px; color: var(--ink-muted); }
  .sure { font-size: 12px; color: var(--ink-muted); }
  .plan-steps { margin: var(--space-2) 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .plan-steps li { display: flex; gap: var(--space-2); align-items: flex-start; }
  .plan-steps .n { font: 500 11px/18px var(--font-mono); color: var(--ink-muted); width: 16px; flex: none; }
  .kbd-hint { font-size: 12px; color: var(--ink-muted); }
  .kbd-hint kbd { font: 500 11px/1 var(--font-mono); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; background: var(--surface); }
  @media (max-width: 1100px) { .call { grid-template-columns: 1fr; } .call__side { border-left: 0; border-top: 1px solid var(--line); border-radius: 0 0 var(--radius-sm) var(--radius-sm); } }
  .call.critical { border-color: var(--risk-line); }
  .call.critical .call__side { background: var(--risk-tint); }
  .call.critical .why { background: var(--risk-tint); color: var(--risk-ink); }

  .handled { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .handled__row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 90px 110px; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); font-size: 13px; }
  .handled__row:last-child { border-bottom: 0; }
  .handled__group { padding: var(--space-2) var(--space-4); background: var(--surface-subtle); border-bottom: 1px solid var(--line); }
  @media (max-width: 900px) { .handled__row { grid-template-columns: 1fr; gap: 4px; } }
  .mini-av { width: 22px; height: 22px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; font: 500 10px/1 var(--font-sans); flex: none; }

  /* Record */
  .rec { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: var(--space-6); align-items: start; }
  @media (max-width: 1100px) { .rec { grid-template-columns: 1fr; } }
  .stages { display: flex; gap: 2px; margin: var(--space-3) 0 var(--space-5); }
  .stages button { all: unset; cursor: pointer; flex: 1; padding: 8px 10px; font: 500 12px/1.2 var(--font-sans); color: var(--ink-muted); background: var(--surface-subtle); border: 1px solid var(--line); text-align: center; }
  .stages button:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .stages button:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .stages button.past { color: var(--slate); background: var(--slate-tint); border-color: var(--slate-tint); }
  .stages button.now { color: var(--on-slate); background: var(--slate); border-color: var(--slate); }
  .tl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .tl__item { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: var(--space-3); padding: var(--space-4); border-bottom: 1px solid var(--line); }
  .tl__item.note { background: var(--copper-tint); }
  .tl__item.sys { padding-top: var(--space-2-5); padding-bottom: var(--space-2-5); }
  .tl__item.sys .tl__body { font-size: 13px; color: var(--ink-muted); }
  .tl__head { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: baseline; }
  .tl__who { font: 600 13px/1.3 var(--font-sans); }
  .tl__when { font-size: 12px; color: var(--ink-muted); }
  .tl__body { margin-top: 4px; font-size: 14px; line-height: 1.55; white-space: pre-line; }
  .chan { font: 500 10px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); border: 1px solid var(--line); padding: 3px 5px; border-radius: 4px; }
  .dot-ico { width: 32px; height: 32px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-subtle); color: var(--ink-muted); border: 1px solid var(--line); }
  .receipts { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
  .composer { padding: var(--space-4); }
  .composer .ds-tabs { margin-bottom: var(--space-3); }
  .composer textarea { min-height: 170px; line-height: 1.55; font-size: 14px; }
  .composer.is-note textarea { background: var(--copper-tint); border-color: var(--copper); }
  .composer__foot { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; justify-content: space-between; margin-top: var(--space-3); }
  .side { display: flex; flex-direction: column; gap: var(--space-4); position: sticky; top: var(--space-4); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .panel__head { display: flex; justify-content: space-between; align-items: center; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); }
  .panel__body { padding: var(--space-4); }
  .facts { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 10px var(--space-3); font-size: 13px; }
  .facts dt { color: var(--ink-muted); }
  .facts dd { margin: 0; }
  .found { margin: var(--space-3) 0 0; padding-left: 18px; font-size: 13px; line-height: 1.55; }
  .found li { margin-bottom: 4px; }
  .next { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-2); }
  .next__row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: var(--space-2); align-items: start; padding: var(--space-2-5); border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 13px; }
  .next__row .n { font: 500 11px/18px var(--font-mono); color: var(--ink-muted); }
  .next__row small { display: block; color: var(--ink-muted); font-size: 12px; margin-top: 2px; }

  /* Autopilot */
  .stage-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: var(--space-3); }
  .stage-card__head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); }
  .stage-card__head h3 { margin: 0; font: 600 14px/1.3 var(--font-sans); }
  .play { display: grid; grid-template-columns: minmax(200px, 1.4fr) auto minmax(160px, 1fr); gap: var(--space-4); align-items: center; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); font-size: 13px; }
  .play:last-child { border-bottom: 0; }
  .play__name { font-weight: 600; }
  .play__when { color: var(--ink-muted); font-size: 12px; margin-top: 2px; }
  .play .ds-seg button { padding: 6px 10px; font-size: 12px; }
  .track { font-size: 12px; color: var(--ink-muted); }
  .track b { color: var(--ink); font-weight: 500; }
  .suggest { margin-top: 6px; display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
  .lock { font-size: 12px; color: var(--ink-muted); display: inline-flex; gap: 6px; align-items: center; }
  @media (max-width: 1100px) { .play { grid-template-columns: 1fr; gap: var(--space-2); } }
  .guard { list-style: none; margin: 0; padding: 0; }
  .guard li { display: flex; gap: var(--space-2-5); align-items: flex-start; padding: var(--space-2-5) 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .guard li:last-child { border-bottom: 0; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--space-6); align-items: start; }
  @media (max-width: 1100px) { .two { grid-template-columns: 1fr; } }

  .toast-wrap { position: fixed; left: 50%; bottom: var(--space-6); transform: translateX(-50%); z-index: 50; }
  .toast { background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: var(--radius-sm); box-shadow: var(--shadow-pop); font-size: 13px; display: flex; gap: var(--space-3); align-items: center; }
  .toast button { all: unset; cursor: pointer; font-weight: 600; color: var(--paper); text-decoration: underline; }
  .note-banner { margin-bottom: var(--space-5); padding: var(--space-2-5) var(--space-3-5); border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); font-size: 12px; color: var(--ink-muted); }
  .src-tag { display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
  .mz-hold { margin-bottom: var(--space-5); }
  .formbox { padding: var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-subtle); font-size: 13px; }
  .bar { height: 6px; background: var(--data-track); border-radius: 99px; overflow: hidden; margin: 6px 0; }
  .bar i { display: block; height: 100%; background: var(--data-bar); }
  .todo-list { display: flex; flex-direction: column; }
  .client-buckets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); margin-bottom: var(--space-6); }
  @media (max-width: 900px) { .client-buckets { grid-template-columns: 1fr; } }
  .cb { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--space-3-5) var(--space-4); }
  .cb .type-eyebrow { color: var(--ink-muted); }
  .cb a { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-2); align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); color: var(--ink); font-size: 13px; }
  .cb a:last-child { border-bottom: 0; }
  .cb .none { font-size: 13px; color: var(--ink-muted); padding-top: 6px; }
  .answered { display: inline-flex; align-items: center; gap: 4px; font: 500 11px/1 var(--font-sans); color: var(--positive); }
  .tl .ds-filters { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<div class="shell">
  <header class="ds-header">
    <div class="brand">
      <img class="logo-light" src="../../packages/design-system/assets/Logos/mezonas-logo.svg" alt="Mezonas">
      <img class="logo-dark" src="../../packages/design-system/assets/Logos/mezonas-logo-paper.svg" alt="Mezonas">
      <span class="place">Back office</span>
    </div>
    <div class="search"><svg class="ic"><use href="#i-search"/></svg>Find a client, lead, issue, build, run or record<kbd>/</kbd></div>
    <div class="head-right">
      <button class="ds-btn ds-btn--ghost ds-btn--sm" id="theme" type="button" aria-label="Switch theme">Dark</button>
      <button class="ds-btn ds-btn--secondary ds-btn--sm" type="button" data-toast="Ask Reggie opens here, as it does today."><svg class="ic"><use href="#i-message"/></svg>Ask Reggie</button>
    </div>
  </header>
  <div class="body">
    <nav class="ds-sidebar" id="nav"></nav>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="toast-wrap" id="toast" hidden></div>

<script>
const SPRITE = "../../packages/design-system/assets/Icons/mezonas-icons-sprite.svg";
fetch(SPRITE).then((r) => r.text()).then((svg) => {
  const box = document.createElement("div");
  box.hidden = true;
  box.innerHTML = svg.replace(/id="mz-/g, 'id="i-');
  document.body.prepend(box);
}).catch(() => {});
const ic = (n, cls = "") => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// ── Made-up data ───────────────────────────────────────────────────────────────────────────────

const CLIENTS = {
  hartley: { name: "Hartley Millwork", since: "Sep 2", monthly: "$3,400", health: "Healthy", contract: "Signed Sep 2 · renews Dec 12", lead: "You" },
  coast: { name: "Coastline HVAC", since: "Jun 18", monthly: "$2,800", health: "Watch", contract: "Signed Jun 18 · renews Dec 20", lead: "You" },
  alder: { name: "Alder Dental", since: "Nov 10", monthly: "$1,900", health: "New", contract: "Signed Nov 10", lead: "You" },
  north: { name: "Northfield Builders", since: "Oct 1", monthly: "$2,200", health: "Healthy", contract: "Signed Oct 1", lead: "You" },
  ruiz: { name: "Ruiz Plumbing Supply", since: "Aug 5", monthly: "$2,100", health: "At risk", contract: "Signed Aug 5", lead: "You" },
  pine: { name: "Pine & Co. Bakery", since: "Nov 14", monthly: "$1,400", health: "New", contract: "Signed Nov 14", lead: "You" },
};

const PIPES = {
  new: {
    section: "sales", name: "New accounts", short: "New", icon: "lead", noun: "deal",

  if (a === "sales" || a === "build") main.innerHTML = section(a, b || "all");
  else if (a === "record") main.innerHTML = record(b);

}

        <button data-tab="done" aria-pressed="${tab === "done"}">Done today (41)</button>
      </div>
      ${tab === "done" ? "" : `<div class="ds-filters">${CALL_KINDS.map(([k, l]) => `<button class="ds-filter" data-call-kind="${k}" aria-pressed="${state.callKind === k}">${l}</button>`).join("")}</div>
      <input class="ds-input dt-search" data-call-q placeholder="Search" value="${esc(state.callQ)}" aria-label="Search">`}
    </div>
    ${tab === "you" ? callList() : tab === "done" ? handledList() : theirList(tab)}
  </div>`;
}

function callMatches(t) {
  if (state.callKind !== "all" && todoKind(t) !== state.callKind) return false;
  const q = state.callQ.trim().toLowerCase();
  return !q || [t.title, t.read, t.cl && CLIENTS[t.cl].name, t.src].join(" ").toLowerCase().includes(q);
}

function callList() {
  if (!yours().length) return `<div class="panel"><div class="panel__body" style="text-align:center; padding: var(--space-10)"><p class="type-subheading" style="margin:0">Nothing needs you right now.</p><p class="muted">Reggie is on ${THEIRS.reggie.length} things. You'll see one here when it needs a person.</p></div></div>`;
  const shown = TODOS.map((t, i) => [t, i]).filter(([t]) => callMatches(t));
  if (!shown.length) return `<div class="dt"><div class="dt-empty">Nothing matches. <button class="ds-btn ds-btn--link small" data-clear-call>Clear the filters</button></div></div>`;
  return `<div class="call-list">${shown.map(([t, i]) => {
    const done = state.done.has(t.id);
    const c = t.card ? card(t.card) : null;
    const d = todoDue(t);
    return `<article class="call ${t.critical ? "critical" : ""} ${i === state.focus ? "is-focus" : ""} ${done ? "is-done" : ""}" data-call="${i}">
      <div class="call__main">
        <div class="row"><span class="src-tag">${esc(t.src)}</span></div>
        <h3>${c ? `<a href="#/record/${c.id}">${esc(t.title)}</a>` : esc(t.title)}</h3>
        <div class="call-meta">${t.cl ? `<span>${clientLink(t.cl)}</span>` : c && c.co ? `<span>${esc(c.co)}</span>` : c && c.many ? `<span>${esc(c.many)}</span>` : ""}<span>${d ? `Due ${due(d)}` : `<span class="mz-due mz-due--none">No date</span>`}</span></div>
        <div class="ds-ai" style="margin-top: var(--space-3)"><i></i>Reggie's read</div>
        <p class="read">${esc(t.read)}</p>
        ${t.plan ? `<ol class="plan-steps">${t.plan.map((p, n) => `<li><span class="n">${n + 1}</span><span>${esc(p)}</span></li>`).join("")}</ol>` : ""}
        <div class="why">${ic("alert")}<span><b>${esc(t.why[0])}.</b> ${esc(t.why[1])}</span></div>
      </div>
      <div class="call__side">
        ${t.draft ? `<div class="draft-to">${esc(t.to)}</div><div class="draft" data-draft>${esc(t.draft)}</div>` : t.to ? `<div class="draft-to">${esc(t.to)}</div>` : ""}
        ${t.form ? `<div class="formbox"><div class="type-label">${esc(t.form.title)}</div><div class="muted tiny" style="margin:4px 0 8px">${esc(t.form.to)} · ${esc(t.form.due)}</div>${t.form.qs.map((q) => `<div class="tiny" style="padding:3px 0">${esc(q)}</div>`).join("")}<div class="muted tiny" style="margin-top:6px">+ 9 answered from the diagnostic</div></div>` : ""}
        ${t.options ? `<div class="small" style="display:flex; flex-direction:column; gap:8px">${t.options.map((o, n) => `<label class="row"><input type="radio" name="opt-${t.id}" ${n === 0 ? "checked" : ""}> ${esc(o)}</label>`).join("")}</div>` : ""}
        ${t.sure ? `<div class="sure">${esc(t.sure)}</div>` : ""}
        <div class="row">
          ${done ? `<span class="ds-pill ds-pill--positive">Done</span>` : `<button class="ds-btn ds-btn--primary ds-btn--sm" data-act="${t.id}">${esc(t.primary)}</button>
          ${t.draft ? `<button class="ds-btn ds-btn--secondary ds-btn--sm" data-edit>Edit</button>` : ""}
          ${t.alt ? `<button class="ds-btn ds-btn--secondary ds-btn--sm" data-toast="Still held. Reggie checks back with you at 12:00.">${esc(t.alt)}</button>` : ""}
          <button class="ds-btn ds-btn--ghost ds-btn--sm" data-toast="Snoozed until tomorrow 9:00.">Later</button>`}
        </div>
      </div>
    </article>`;
  }).join("")}</div>`;
}

// Reggie's and the clients' lists: a table with the same columns as everywhere else.
function theirList(who) {
  const kindKey = (k) => (/Issue/.test(k) ? "issues" : /build/i.test(k) ? "builds" : /account|Expansion/.test(k) ? "sales" : "other");
  const q = state.callQ.trim().toLowerCase();
  const rows = THEIRS[who]
    .map((r) => ({ kind: r[0], what: r[1], client: r[2], due: r[3], card: r[4] }))
    .filter((r) => state.callKind === "all" || kindKey(r.kind) === state.callKind)
    .filter((r) => !q || `${r.what} ${r.client} ${r.kind}`.toLowerCase().includes(q));
  const key = `their-${who}`;
  const sorted = sortRows(key, rows, { due: (r) => r.due || "9999", what: (r) => r.what, client: (r) => r.client, kind: (r) => r.kind }, "due");
  const intro = who === "reggie" ? "What Reggie is working on now. Take one to do it yourself." : "Waiting on clients. Reggie chases these; an overdue one also comes to you.";
  return `<p class="muted small" style="margin-top:0">${intro}</p>
  <div class="dt"><div class="dt-wrap"><table class="dt-ana"><thead><tr>
    ${th(key, "what", "What")}${th(key, "client", "Client")}${th(key, "kind", "Kind")}${th(key, "due", "Due")}<th></th>
  </tr></thead><tbody>${sorted.length ? sorted.map((r) => `<tr ${r.card ? `data-href="#/record/${r.card}"` : ""}>
    <td><span class="cell-title">${esc(r.what)}</span></td><td>${esc(r.client)}</td><td><span class="src-tag">${esc(r.kind)}</span></td><td>${due(r.due)}</td>
    <td style="text-align:right">${who === "reggie" ? `<button class="ds-btn ds-btn--link small" data-toast="It's yours now. Reggie stops and leaves its notes.">Take it</button>` : `<button class="ds-btn ds-btn--link small" data-toast="Reggie sends a reminder now.">Remind</button>`}</td>
  </tr>`).join("") : `<tr><td colspan="5"><div class="dt-empty">Nothing matches.</div></td></tr>`}</tbody></table></div></div>`;
}

function handledList() {
  return `<p class="muted small" style="margin-top:0">Everything Reggie did on its own today. Spot-check a few; each one you flag goes on its play's record.</p>
  <div class="handled">${HANDLED.map(([g, rows]) => `<div class="handled__group type-eyebrow muted">${g}</div>${rows.map((r) => `
    <div class="handled__row"><span class="muted num">${r[0]}</span><span>${esc(r[1])}</span><span>${r[2] === "Sent" ? `<span class="ds-pill ds-pill--neutral ds-pill--sm">Sent</span>` : `<span class="mz-agentline">Internal</span>`}</span><span class="row">${r[3] ? `<a href="#/record/${r[3]}">Open</a>` : ""}<button class="ds-btn ds-btn--link small" data-toast="Flagged: Reggie shouldn't have. It goes on the play's record.">Flag</button></span></div>`).join("")}`).join("")}
  </div>`;
}

// ── Sorting, shared by every table ───────────────────────────────────────────────────────────

function th(key, col, label, num) {
  const s = state.sort[key];
  const aria = s && s.col === col ? `aria-sort="${s.dir > 0 ? "ascending" : "descending"}"` : "";
  return `<th ${num ? 'class="n"' : ""} ${aria}><button class="dt-sort" data-sort="${key}:${col}">${label}</button></th>`;
}
function sortRows(key, rows, getters, def, defDir = 1) {
  const s = state.sort[key] || { col: def, dir: defDir };
  const get = getters[s.col] || getters[def];
  return [...rows].sort((a, b) => {
    const x = get(a), y = get(b);
    return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * s.dir;
  });
}

// ── Sales and Build: one sidebar item each, with tabs ─────────────────────────────────────────

const ST_ORDER = { you: 0, stalled: 1, agent: 2, client: 3, done: 4 };
const URG_ORDER = { critical: 0, high: 1, normal: 2, low: 3 };
const rankOf = (id) => { const i = WORK.findIndex(([w]) => w === id); return i < 0 ? 999 : i + 1; };

const FILTERS = [
  ["open", "Open", (c) => c.st !== "done"],
  ["you", "Needs you", (c) => c.st === "you"],
  ["agent", "Reggie on it", (c) => c.st === "agent"],
  ["client", "Waiting on the client", (c) => c.st === "client"],
  ["stuck", "Stuck or held", (c) => c.st === "stalled"],
  ["late", "Late", isLate],
  ["critical", "Critical and high", (c) => c.urg === "critical" || c.urg === "high"],
  ["done", "Done", (c) => c.st === "done"],
];

function section(sec, tab) {
  const S = SECTIONS[sec];
  const key = `${sec}/${tab}`;
  const pipes = tab === "all" ? S.pipes : [tab];
  const all = CARDS.filter((c) => pipes.includes(c.pipe));
  const filters = FILTERS.filter(([k]) => k !== "critical" || pipes.includes("issues"));
  const fk = state.filter[key] || "open";
  const q = (state.q[key] || "").trim().toLowerCase();
  const pass = filters.find(([k]) => k === fk)[2];
  const cards = all.filter(pass).filter((c) => !q || [c.title, c.desc, clientName(c), c.stText, stageOf(c).name].join(" ").toLowerCase().includes(q));
  const canBoard = tab !== "all";
  const view = canBoard ? state.view[key] || "board" : "list";
  const title = tab === "all" ? S.name : PIPES[tab].name;
  const tabCount = (t) => CARDS.filter((c) => (t === "all" ? S.pipes : [t]).includes(c.pipe) && c.st !== "done").length;

  return `<div class="page page--full">
    ${sec === "build" ? holdBanner() : ""}
    <div class="page-head" style="margin-bottom: var(--space-4)">
      <div><h1>${esc(S.name)}</h1><p>${sec === "sales" ? "New accounts and expansion in one place. Reggie keeps every deal moving; prices and terms are yours." : "Issues, agent builds and enhancements in one order. Reggie keeps the order; you can move anything."}</p></div>
      <div class="row">
        <a class="ds-btn ds-btn--ghost ds-btn--sm" href="#/autopilot/${tab === "all" ? (sec === "sales" ? "new" : "issues") : tab}">${ic("settings")}Autopilot</a>
        <button class="ds-btn ds-btn--primary ds-btn--sm" data-toast="${sec === "sales" ? "New deal: type a company or paste an email, and Reggie fills in the rest." : "New issue, build or enhancement: describe it or paste an email, and Reggie sorts it."}">${ic("add")}New ${sec === "sales" ? "deal" : "item"}</button>
      </div>
    </div>
    <nav class="ds-tabs page-tabs" aria-label="${esc(S.name)}">${S.tabs.map(([t, l]) => `<a href="#/${sec}/${t}" ${t === tab ? 'aria-current="page"' : ""}>${esc(l)}<span class="count">${tabCount(t)}</span></a>`).join("")}</nav>
    <div class="ds-kpis">${sec === "sales" ? salesKpis(all) : buildKpis(all, tab)}</div>
    <div class="dt dt--page">
      <div class="ds-datahead">
        <div class="dt-bar">
          <div class="ds-filters">${filters.map(([k, l, f]) => `<button class="ds-filter" data-filter="${key}:${k}" aria-pressed="${fk === k}">${l}<span class="ds-num">${all.filter(f).length}</span></button>`).join("")}</div>
          <input class="ds-input dt-search" data-q="${key}" placeholder="Search ${esc(title.toLowerCase())}" value="${esc(state.q[key] || "")}" aria-label="Search">
          ${canBoard ? `<div class="ds-seg" role="group"><button data-view="${key}:board" aria-pressed="${view === "board"}">Board</button><button data-view="${key}:list" aria-pressed="${view === "list"}">List</button></div>` : ""}
        </div>
        ${view === "board" ? boardHeads(sec, tab, cards) : ""}
      </div>
      ${view === "board" ? boardBody(tab, cards) : sec === "sales" ? salesTable(key, cards, tab) : buildTable(key, cards, tab)}
      <div class="dt-status">${statusLine(sec, cards)}</div>
    </div>
  </div>`;
}

const weighted = (c) => c.mrr * (stageOf(c).p ?? 0);
function salesKpis(all) {
  const open = all.filter((c) => c.st !== "done");
  const won = all.filter((c) => c.st === "done");
  return [
    kpi("Potential a month", money(open.reduce((n, c) => n + c.mrr, 0)), `${money(open.reduce((n, c) => n + weighted(c), 0))} weighted by stage`),
    kpi("Open deals", open.length, `${open.filter((c) => c.pipe === "new").length} new · ${open.filter((c) => c.pipe === "grow").length} expansion`),
    kpi("Agents in play", open.reduce((n, c) => n + c.agents, 0), "Sold or offered, not live"),
    kpi("Need you", open.filter((c) => c.st === "you").length, "Prices, terms and first replies", "signal"),
    kpi("Late or stuck", open.filter((c) => isLate(c) || c.st === "stalled").length, "Quiet, held or past due", open.some((c) => isLate(c)) ? "risk" : ""),
    kpi("Won this month", money(won.reduce((n, c) => n + c.mrr, 0)), `${won.length} deal${won.length === 1 ? "" : "s"}`, "positive"),
  ].join("");
}
function buildKpis(all, tab) {
  const open = all.filter((c) => c.st !== "done");
  const late = open.filter(isLate).length;
  const by = (p) => open.filter((c) => c.pipe === p);
  const list = [];
  if (tab === "all" || tab === "issues") list.push(kpi("Critical, held", by("issues").filter((c) => c.urg === "critical").length, "Coastline HVAC since 6:12", "risk", "#/record/i-1051"));
  if (tab === "all") list.push(kpi("Open issues", by("issues").length, `${by("issues").filter((c) => c.urg === "high").length} high`), kpi("Builds in progress", by("builds").length, `${by("builds").filter((c) => c.st === "client").length} waiting on clients`), kpi("Promised dates at risk", by("builds").filter((c) => c.st === "stalled").length, "Coastline, Nov 24", "signal"), kpi("Enhancement asks", by("enh").length, "Top one: 4 clients"));
  if (tab === "issues") list.push(kpi("Open", by("issues").length, `${by("issues").filter((c) => c.urg === "high").length} high`), kpi("Median first reply", "18 min", "Target 1 hour"), kpi("Fixed within target", "9 of 11", "This month", "positive"));
  if (tab === "builds") list.push(kpi("In progress", by("builds").length, "1 new agent, the rest from templates"), kpi("Waiting on clients", by("builds").filter((c) => c.st === "client").length, "Reggie chases every 2 days"), kpi("Dates at risk", by("builds").filter((c) => c.st === "stalled").length, "Coastline, Nov 24", "signal"), kpi("Next promised", "Nov 24", "Coastline HVAC"), kpi("Live this month", 1, "Ruiz Plumbing Supply", "positive"));
  if (tab === "enh") list.push(kpi("Open asks", by("enh").length, "From 7 clients"), kpi("Most asked", "4 clients", "POs as PDF and CSV"), kpi("Need you", by("enh").filter((c) => c.st === "you").length, "Decide or approve", "signal"), kpi("Shipped this month", 3, "Everyone who asked was told", "positive"));
  list.push(kpi("Late", late, late ? "Past the date we set" : "Nothing late", late ? "risk" : ""));
  return list.join("");
}
function statusLine(sec, cards) {
  const open = cards.filter((c) => c.st !== "done");
  if (sec === "sales") return `<span><b>${cards.length}</b> shown</span><span><b>${open.reduce((n, c) => n + c.agents, 0)}</b> agents</span><span><b>${money(open.reduce((n, c) => n + c.mrr, 0))}</b> a month open</span><span><b>${money(open.reduce((n, c) => n + weighted(c), 0))}</b> weighted</span>`;
  return `<span><b>${cards.length}</b> shown</span><span><b>${open.filter((c) => c.st === "you").length}</b> need you</span><span><b>${open.filter(isLate).length}</b> late</span>`;
}

function salesTable(key, cards, tab) {
  const rows = sortRows(key, cards, {
    due: (c) => (c.st === "done" ? "9999-z" : c.due || "9999"), deal: (c) => c.title, client: clientName, pipe: (c) => c.pipe,
    stage: (c) => (c.pipe === "grow" ? 10 : 0) + stageIdx(c), status: (c) => ST_ORDER[c.st], agents: (c) => c.agents, mrr: (c) => c.mrr,
  }, "due");
  return `<div class="dt-wrap"><table><thead><tr>
    ${th(key, "client", "Client")}${th(key, "deal", "Deal")}${tab === "all" ? th(key, "pipe", "Kind") : ""}${th(key, "stage", "Stage")}${th(key, "status", "Where it stands")}${th(key, "agents", "Agents", true)}${th(key, "mrr", "A month", true)}${th(key, "due", "Next step due")}
  </tr></thead><tbody>${rows.length ? rows.map((c) => `<tr data-href="#/record/${c.id}" class="${c.st === "done" ? "is-done" : ""}">
    <td><span class="cell-title">${c.cl ? `<a class="cell-title" href="#/client/${c.cl}" data-stop>${esc(CLIENTS[c.cl].name)}</a>` : esc(c.co)}</span><span class="cell-why">${c.cl ? "Client" : "Lead"}</span></td>
    <td>${esc(c.title)}<span class="cell-desc">${esc(c.desc)}</span></td>
    ${tab === "all" ? `<td><span class="src-tag">${c.pipe === "new" ? "New" : "Expansion"}</span></td>` : ""}
    <td class="stage-mini">${esc(stageOf(c).name)}<small>${Math.round((stageOf(c).p ?? 0) * 100)}% likely</small></td>
    <td>${status(c)}</td>
    <td class="n">${c.agents || "–"}</td>
    <td class="n">${c.pipe === "grow" && c.title.startsWith("Renewal") ? money(c.mrr) : (c.pipe === "grow" ? "+" : "") + money(c.mrr)}</td>
    <td>${due(c.due, c.st === "done")}</td>
  </tr>`).join("") : `<tr><td colspan="8"><div class="dt-empty">Nothing matches. <button class="ds-btn ds-btn--link small" data-clear="${key}">Clear the search and filters</button></div></td></tr>`}</tbody></table></div>`;
}

function buildTable(key, cards, tab) {
  const rows = sortRows(key, cards, {
    rank: (c) => (c.st === "done" ? 1000 : rankOf(c.id)), what: (c) => c.title, client: clientName, kind: (c) => c.pipe,
    stage: (c) => stageIdx(c), status: (c) => ST_ORDER[c.st], urg: (c) => URG_ORDER[c.urg] ?? 9, due: (c) => (c.st === "done" ? "9999-z" : c.due || "9999"),
  }, "rank");
  const dueLabel = tab === "all" ? "Due" : PIPES[tab].due;
  const why = (id) => WORK.find(([w]) => w === id);
  return `<div class="dt-wrap"><table><thead><tr>
    ${th(key, "rank", "#")}${th(key, "what", tab === "all" ? "What" : PIPES[tab].short)}${th(key, "client", "Client")}${tab === "all" ? th(key, "kind", "Kind") : ""}${th(key, "stage", "Stage")}${th(key, "status", "Where it stands")}${tab === "all" || tab === "issues" ? th(key, "urg", "Urgency") : ""}${th(key, "due", dueLabel)}
  </tr></thead><tbody>${rows.length ? rows.map((c) => {
    const w = why(c.id);
    return `<tr data-href="#/record/${c.id}" class="${w && w[2] ? "is-moved" : ""} ${c.st === "done" ? "is-done" : ""}">
    <td><span class="rank">${c.st === "done" ? "–" : rankOf(c.id) < 999 ? rankOf(c.id) : "–"}</span></td>
    <td><span class="cell-title">${esc(c.title)}</span><span class="cell-desc">${esc(c.desc)}</span>${w && tab === "all" ? `<span class="cell-why">${w[2] ? `<span class="ds-ai"><i></i>Moved by Reggie</span> ` : ""}${esc(w[1])}</span>` : ""}</td>
    <td>${clientCell(c)}</td>
    ${tab === "all" ? `<td><span class="src-tag">${esc(PIPES[c.pipe].short)}</span></td>` : ""}
    <td class="stage-mini">${esc(stageOf(c).name)}</td>
    <td>${status(c)}</td>
    ${tab === "all" || tab === "issues" ? `<td>${urg(c.urg)}</td>` : ""}
    <td>${due(c.due, c.st === "done")}</td>
  </tr>`;
  }).join("") : `<tr><td colspan="8"><div class="dt-empty">Nothing matches. <button class="ds-btn ds-btn--link small" data-clear="${key}">Clear the search and filters</button></div></td></tr>`}</tbody></table></div>`;
}

// Boards: the stage heads stick with the toolbar and carry each stage's totals.
function stages(tab) { return PIPES[tab].stages; }
function boardHeads(sec, tab, cards) {
  const ss = stages(tab);
  return `<div class="mz-board__heads" style="--stages:${ss.length}" data-heads>${ss.map((s) => {
    const cs = cards.filter((c) => c.stage === s.id);
    const totals = sec === "sales"
      ? `<span><b>${cs.length}</b> deal${cs.length === 1 ? "" : "s"}</span><span><b>${cs.reduce((n, c) => n + c.agents, 0)}</b> agent${cs.reduce((n, c) => n + c.agents, 0) === 1 ? "" : "s"}</span><span><b>${money(cs.reduce((n, c) => n + c.mrr, 0))}</b>/mo</span>`
      : `<span><b>${cs.filter((c) => c.st === "you").length}</b> need you</span><span><b>${cs.filter(isLate).length}</b> late</span>`;
    return `<div class="mz-stagehead"><div class="mz-stagehead__name"><span>${esc(s.name)}</span><span>${cs.length}</span></div><div class="mz-stagehead__totals">${totals}</div></div>`;
  }).join("")}</div>`;
}
function boardBody(tab, cards) {
  const ss = stages(tab);
  return `<div class="mz-board__body" style="--stages:${ss.length}" data-body>${ss.map((s) => {
    const cs = sortRows(`board-${tab}`, cards.filter((c) => c.stage === s.id), { due: (c) => c.due || "9999" }, "due");
    return `<section class="mz-board__col" data-stage="${s.id}"><div class="mz-board__auto">${esc(s.auto)}</div>${cs.map(kcard).join("")}</section>`;
  }).join("")}</div>`;
}

function kcard(c) {
  const sales = c.pipe === "new" || c.pipe === "grow";
  return `<a class="mz-kcard ${c.st === "you" ? "mz-kcard--you" : ""} ${c.urg === "critical" ? "mz-kcard--critical" : ""}" href="#/record/${c.id}" draggable="true" data-card="${c.id}">
    <div class="mz-kcard__top"><span class="mz-kcard__title">${esc(sales ? clientName(c) : c.title)}</span>${urg(c.urg)}</div>
    <div class="mz-kcard__desc">${sales ? esc(c.title) : esc(clientName(c))}</div>
    <div class="mz-kcard__foot">${status(c)}</div>

// ── Record (any card) ─────────────────────────────────────────────────────────────────────────

function record(id) {
  const c = card(id);
  if (!c) return `<div class="page"><p>Not found. <a href="#/call">Back to Your call</a></p></div>`;
  const r = RECORDS[id] || genericRecord(c);
  const p = PIPES[c.pipe];
  // A build from a template skips the Builder's phases; a new agent shows them as one stage.
  const stages = c.pipe === "builds" && !c.custom ? p.stages.filter((s) => s.id !== "building") : p.stages;
  const idx = stages.findIndex((s) => s.id === c.stage);
  const isLead = c.pipe === "new" && !c.cl;
  if (!r.timeline) r.timeline = [];
  const tl = r.timeline.map(tlItem).join("");
  return `<div class="page">
    ${r.hold ? `<div class="mz-hold"><span>${ic("alert")} <b>Safety hold on since 6:12.</b> The Bookkeeper's writes and messages are stopped; its runs go on as drafts. 4 items held.</span><span class="row"><button class="ds-btn ds-btn--secondary ds-btn--sm" data-toast="4 held: 2 postings, 1 category change, 1 email. Send, edit or drop each.">Review held items</button><button class="ds-btn ds-btn--secondary ds-btn--sm" data-toast="Rolled back to v6 (a new version, approval on). The hold stays until you release it.">Roll back to v6</button><button class="ds-btn ds-btn--primary ds-btn--sm" data-toast="Release after the fix: the hold comes off once v6 is live.">Release after fix</button></span></div>` : ""}
    <div class="crumbs"><a href="#/${p.section}/all">${esc(SECTIONS[p.section].name)}</a>${ic("chevron-right")}<a href="#/${p.section}/${c.pipe}">${esc(p.name)}</a>${c.cl ? `${ic("chevron-right")}${clientLink(c.cl)}` : ""}</div>
    <div class="page-head" style="margin-bottom:0">
      <div><h1>${esc(c.co || c.title)}</h1><p>${c.co ? `${esc(c.title)} · ` : ""}${esc(c.desc)}</p><div class="call-meta">${c.cl ? `<span>${clientLink(c.cl)}</span>` : ""}${c.agents != null ? `<span>${c.agents ? `${c.agents} agent${c.agents === 1 ? "" : "s"} · ` : ""}${money(c.mrr)} a month</span>` : ""}<span>${p.due || "Next step due"} ${due(c.due, c.st === "done")}</span></div></div>
      <div class="row">${urg(c.urg)}${status(c)}
        <button class="ds-btn ds-btn--secondary ds-btn--sm" data-toast="${c.pipe === "new" ? "Lost: a reason, and Reggie drafts a check-back in 90 days." : "Closing tells the client and links what did it."}">${c.pipe === "new" ? "Lost" : "Close"}</button>
      </div>
    </div>
    <div class="stages" role="group" aria-label="Stage">${stages.map((s, n) => `<button class="${n < idx ? "past" : n === idx ? "now" : ""}" data-toast="Moved to ${esc(s.name)}. That stage's plays start now.">${esc(s.name)}</button>`).join("")}</div>
    <div class="rec">
      <div>
        <div class="tl">
          <div class="composer" id="composer">
            <div class="ds-tabs" role="tablist"><button role="tab" aria-selected="true" data-ctab="reply">${isLead ? "Email" : "Reply to the client"}</button><button role="tab" aria-selected="false" data-ctab="note">Internal note</button>${isLead ? "" : `<button role="tab" aria-selected="false" data-ctab="desk">Ask on their Desk</button>`}<button role="tab" aria-selected="false" data-ctab="todo">To-do</button></div>
            <div class="row" style="margin-bottom: var(--space-2)"><span class="draft-to">${esc(r.to)}</span></div>
            <textarea class="ds-textarea" id="compose">${esc(r.draft)}</textarea>
            <div class="ds-aiblock" style="margin-top: var(--space-2)"><span class="ds-ai"><i></i>Reggie drafted this</span><span class="row"><button data-toast="Shorter version in the box.">Shorter</button><button data-toast="Spanish version in the box.">In Spanish</button><button data-toast="Reggie writes it again.">Again</button></span></div>
            <div class="composer__foot"><span class="muted tiny">Goes on the timeline as activity.</span><div class="row"><button class="ds-btn ds-btn--ghost ds-btn--sm" data-toast="Scheduled for 8:00 tomorrow, their time.">Send later</button><button class="ds-btn ds-btn--primary ds-btn--sm" data-toast="Sent, and on the timeline.">Send</button></div></div>
          </div>

          <div class="panel__head"><span class="type-label">To-dos on this ${esc(p.noun)}</span><button class="ds-btn ds-btn--link small" data-toast="Add a to-do: yours, Reggie's or the client's, with a due time.">Add</button></div>
          <div class="panel__body" style="padding-top: var(--space-1); padding-bottom: var(--space-1)"><div class="todo-list">${r.todos.length ? r.todos.map(([o, t, d]) => `<div class="mz-todo"><input type="checkbox" aria-label="Done"><div>${esc(t)}<small>${esc(d)}</small></div>${ownerChip(o)}</div>`).join("") : `<p class="muted small">None open.</p>`}</div></div>

// ── Wiring ───────────────────────────────────────────────────────────────────────────────────

function toast(text) {
  const t = document.getElementById("toast");
  t.innerHTML = `<div class="toast"><span>${esc(text)}</span></div>`;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.hidden = true), 3400);
}

function wire() {
  const on = (sel, fn) => document.querySelectorAll(sel).forEach((el) => el.addEventListener("click", (e) => fn(el, e)));
  const split = (v) => { const i = v.lastIndexOf(":"); return [v.slice(0, i), v.slice(i + 1)]; };
  on("[data-toast]", (b, e) => { e.preventDefault(); e.stopPropagation(); toast(b.dataset.toast); });
  on("[data-stop]", (a, e) => e.stopPropagation());
  on("[data-tab]", (b) => { state.tab = b.dataset.tab; render(true); });
  on("[data-act]", (b) => act(b.dataset.act));
  on("[data-edit]", (b) => { const d = b.closest(".call").querySelector("[data-draft]"); d.contentEditable = "true"; d.classList.add("open"); d.focus(); });
  on("[data-draft]", (d) => d.classList.add("open"));
  on("[data-call]", (el) => { state.focus = Number(el.dataset.call); document.querySelectorAll(".call").forEach((c) => c.classList.toggle("is-focus", Number(c.dataset.call) === state.focus)); });
  on("[data-call-kind]", (b) => { state.callKind = b.dataset.callKind; render(true); });
  on("[data-clear-call]", () => { state.callKind = "all"; state.callQ = ""; render(true); });
  on("[data-filter]", (b) => { const [k, v] = split(b.dataset.filter); state.filter[k] = v; render(true); });
  on("[data-view]", (b) => { const [k, v] = split(b.dataset.view); state.view[k] = v; render(true); });
  on("[data-clear]", (b) => { state.filter[b.dataset.clear] = "open"; state.q[b.dataset.clear] = ""; render(true); });
  on("[data-sort]", (b) => {
    const [k, col] = split(b.dataset.sort);
    const s = state.sort[k];
    state.sort[k] = { col, dir: s && s.col === col ? -s.dir : 1 };
    render(true);
  });
  on("[data-act-filter]", (b) => { state.act = b.dataset.actFilter; render(true); });
  on("tr[data-href]", (tr, e) => { if (!e.target.closest("a, button")) location.hash = tr.dataset.href; });
  // Search: re-render as you type and keep the cursor in the box.
  const typed = (sel, set) => document.querySelectorAll(sel).forEach((inp) => inp.addEventListener("input", () => {
    set(inp);
    const pos = inp.selectionStart;
    render(true);
    const again = document.querySelector(sel);
    if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  }));
  typed("[data-q]", (inp) => (state.q[inp.dataset.q] = inp.value));
  typed("[data-call-q]", (inp) => (state.callQ = inp.value));
  // The board's stage heads scroll sideways with its columns.
  const heads = document.querySelector("[data-heads]"), body = document.querySelector("[data-body]");
  if (heads && body) body.addEventListener("scroll", () => (heads.scrollLeft = body.scrollLeft), { passive: true });
  on("[data-ctab]", (b) => {
    document.querySelectorAll("[data-ctab]").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
    document.getElementById("composer").classList.toggle("is-note", b.dataset.ctab === "note");
    const ta = document.getElementById("compose");
    if (b.dataset.ctab === "note") ta.value = "";
    if (b.dataset.ctab === "desk") ta.value = "A question for the client admin, with quick answers they can tap.";
    if (b.dataset.ctab === "todo") ta.value = "What needs doing, whose it is (you, Reggie or the client) and by when.";
  });
  on("[data-level]", (b) => {
    if (b.disabled) return;
    const [sid, i, v] = b.dataset.level.split(":");
    PLAYS[route()[1] || "issues"][sid][Number(i)].level = v;
    render(true);
    toast(v === "send" ? "Reggie does these on its own now and lists them under Done today." : v === "draft" ? "Reggie drafts these for you." : "Reggie won't do this.");
  });
  document.querySelectorAll("[data-card]").forEach((c) => c.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", c.dataset.card)));
  document.querySelectorAll(".mz-board__col").forEach((col) => {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("is-drop"); });
    col.addEventListener("dragleave", () => col.classList.remove("is-drop"));
    col.addEventListener("drop", (e) => {
      e.preventDefault();
      const c = card(e.dataTransfer.getData("text/plain"));
      if (!c) return;
      c.stage = col.dataset.stage;
      render(true);
      toast(`Moved to ${stageOf(c).name}. That stage's plays start now.`);
    });
  });
}

function act(id) {
  const t = TODOS.find((x) => x.id === id);
  if (t.id === "t-run") { toast("Opens the run's review, as the run audit queue does today."); return; }
  state.done.add(id);
  render(true);
  const box = document.getElementById("toast");
  box.innerHTML = `<div class="toast"><span>${esc(t.primary)}: done.${t.draft ? " Sends in 60 seconds." : ""}</span><button id="undo">Undo</button></div>`;
  box.hidden = false;
  document.getElementById("undo").onclick = () => { state.done.delete(id); box.hidden = true; render(); };
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (box.hidden = true), 5000);
  const next = TODOS.findIndex((x) => !state.done.has(x.id));
  if (next >= 0) state.focus = next;
}

document.addEventListener("keydown", (e) => {
  if (route()[0] !== "call" || state.tab !== "you") return;
  if (e.target.closest("textarea, input, [contenteditable='true']")) return;
  const max = TODOS.length - 1;
  if (e.key === "j") state.focus = Math.min(max, state.focus + 1);
  else if (e.key === "k") state.focus = Math.max(0, state.focus - 1);
  else if (e.key === "s") return act(TODOS[state.focus].id);
  else if (e.key === "o" && TODOS[state.focus].card) return void (location.hash = `#/record/${TODOS[state.focus].card}`);
  else if (e.key === "e") return document.querySelectorAll("[data-call]")[state.focus]?.querySelector("[data-edit]")?.click();
  else return;
  document.querySelectorAll(".call").forEach((c) => c.classList.toggle("is-focus", Number(c.dataset.call) === state.focus));
  document.querySelector(`.call[data-call="${state.focus}"]`)?.scrollIntoView({ block: "nearest" });
});

const themeBtn = document.getElementById("theme");
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
const themeLabel = () => (themeBtn.textContent = isDark() ? "Light" : "Dark");
themeBtn.addEventListener("click", () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; themeLabel(); });
themeLabel();

window.addEventListener("hashchange", () => render());
render();
</script>
</body>
</html>
