<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mezonas builder prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  Mezonas builder prototype (owner, 2026-11-21): describe it in a paragraph, check the steps the
  Builder reads from it (how it starts, then a line a step; a decision is its own kind of line: If,
  Or if, Otherwise, each path rejoining or ending), then change them on one canvas. Drag steps, add decisions between them, click a step for its whole
  setup with the Builder underneath. Design only: the Builder's answers and the try's results are
  scripted, nothing is saved, and no route is called. Tokens: packages/design-system/tokens.css.
  What it maps to in the code is in the page's own notes ("About this prototype").
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: one sticky bar; a slim rail of step kinds; the flow as one centred column; one sheet on the right. */
:root{
  --font-sans:"Geist",ui-sans-serif,system-ui,sans-serif;--font-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --paper:#FAFAF9;--surface:#FFFFFF;--surface-subtle:#F2F3F2;--line:#E6E8EA;--line-strong:#8A9199;
  --ink:#1A1F26;--ink-muted:#5B636D;--ink-faint:#959CA4;
  --slate:#23415E;--slate-hover:#1A3249;--slate-tint:#EDF1F5;--on-slate:#FFFFFF;
  --copper:#9A4D27;--copper-ink:#7A3D1F;--copper-tint:#F8ECE4;
  --signal:#E3A417;--signal-ink:#6B4C05;--signal-tint:#FBF0D2;
  --risk:#A3302A;--risk-ink:#8A2B26;--risk-tint:#F9E5E3;--risk-line:#EDB9B5;
  --positive:#1F6B4A;--positive-tint:#E2F0E8;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-pill:999px;
  --shadow-xs:0 1px 2px rgba(21,26,33,.08);--shadow-pop:0 8px 24px rgba(21,26,33,.12);--focus-halo:0 0 0 4px rgba(35,65,94,.18);
  --scrim:rgba(21,26,33,.4);
  --bar-h:56px;--rail-w:236px;--sheet-w:452px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1318;--surface:#171C23;--surface-subtle:#1D232B;--line:#2A313A;--line-strong:#6B747E;
  --ink:#E6E9EC;--ink-muted:#9DA5AF;--ink-faint:#6B737D;
  --slate:#8FB0D2;--slate-hover:#A9C3DE;--slate-tint:#1C2A38;--on-slate:#0F1318;
  --copper:#D9895E;--copper-ink:#E3A07C;--copper-tint:#33231A;
  --signal:#E3A417;--signal-ink:#F0C766;--signal-tint:#3A2E10;
  --risk:#E8807A;--risk-ink:#F2A39E;--risk-tint:#3A1C1A;--risk-line:#5A2A27;
  --positive:#7CC4A0;--positive-tint:#17301F;
  --shadow-pop:0 8px 24px rgba(0,0,0,.5);--focus-halo:0 0 0 4px rgba(143,176,210,.25);--scrim:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1318;--surface:#171C23;--surface-subtle:#1D232B;--line:#2A313A;--line-strong:#6B747E;
  --ink:#E6E9EC;--ink-muted:#9DA5AF;--ink-faint:#6B737D;
  --slate:#8FB0D2;--slate-hover:#A9C3DE;--slate-tint:#1C2A38;--on-slate:#0F1318;
  --copper:#D9895E;--copper-ink:#E3A07C;--copper-tint:#33231A;
  --signal:#E3A417;--signal-ink:#F0C766;--signal-tint:#3A2E10;
  --risk:#E8807A;--risk-ink:#F2A39E;--risk-tint:#3A1C1A;--risk-line:#5A2A27;
  --positive:#7CC4A0;--positive-tint:#17301F;
  --shadow-pop:0 8px 24px rgba(0,0,0,.5);--focus-halo:0 0 0 4px rgba(143,176,210,.25);--scrim:rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/20px var(--font-sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
.ico.s20{width:20px;height:20px}
.eyebrow{font:500 10px/14px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.muted{color:var(--ink-muted)}
.small{font-size:13px;line-height:18px}
.grow{flex:1 1 auto;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}

/* Design-system controls (ds-btn, ds-input, ds-seg, ds-pill), as in components/bundle.css */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:var(--radius-md);font:500 13px/1 var(--font-sans);cursor:pointer;white-space:nowrap;transition:background 160ms}
.btn:focus-visible,.seg button:focus-visible,.plus:focus-visible,.card:focus-visible,.block:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.btn--pri{background:var(--slate);color:var(--on-slate)}.btn--pri:hover{background:var(--slate-hover)}
.btn--sec{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}.btn--sec:hover{background:var(--surface-subtle)}
.btn--ghost{color:var(--ink)}.btn--ghost:hover{background:var(--surface-subtle)}
.btn--sm{height:30px;padding:0 12px;font-size:12px}
.btn--icon{width:30px;height:30px;padding:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{all:unset;color:var(--slate);font:500 13px/18px var(--font-sans);cursor:pointer}.linkbtn:hover{text-decoration:underline}
.input,.select,.textarea{width:100%;height:36px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font:400 14px/1.4 var(--font-sans)}
.textarea{height:auto;padding:8px 12px;resize:vertical;line-height:20px}
.input::placeholder,.textarea::placeholder{color:var(--ink-faint)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--slate);box-shadow:var(--focus-halo)}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface-subtle);border:1px solid var(--line);border-radius:var(--radius-md);max-width:100%;flex-wrap:wrap}
.seg button{all:unset;padding:6px 12px;border-radius:var(--radius-sm);font:500 13px/1 var(--font-sans);color:var(--ink-muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-xs)}
.seg button[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;font:500 11px/14px var(--font-sans);white-space:nowrap;border:1px solid;border-radius:var(--radius-pill)}
.pill--neutral{color:var(--ink-muted);background:var(--surface-subtle);border-color:var(--line)}
.pill--accent{color:var(--slate);background:var(--slate-tint);border-color:var(--slate-tint)}
.pill--person{color:var(--copper-ink);background:var(--copper-tint);border-color:var(--copper-tint)}
.pill--wait{color:var(--signal-ink);background:var(--signal-tint);border-color:var(--signal)}
.pill--risk{color:var(--risk-ink);background:var(--risk-tint);border-color:var(--risk-line)}
.pill--ok{color:var(--positive);background:var(--positive-tint);border-color:var(--positive-tint)}
.field{display:grid;gap:6px}
.field>label,.label{font:500 13px/16px var(--font-sans);color:var(--ink)}
.help{font-size:12px;line-height:17px;color:var(--ink-muted)}
.switch{all:unset;width:32px;height:18px;border-radius:var(--radius-pill);background:var(--line-strong);padding:2px;box-sizing:border-box;display:inline-flex;flex:none;cursor:pointer;transition:background 160ms}
.switch::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform 160ms}
.switch[aria-checked="true"]{background:var(--slate)}.switch[aria-checked="true"]::after{transform:translateX(14px)}

/* Bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar__in{display:flex;align-items:center;gap:12px;min-height:var(--bar-h);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.mark{width:22px;height:22px;color:var(--slate);flex:none}
.crumb{font-size:13px;color:var(--ink-muted);white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;background:var(--slate);color:var(--on-slate);display:inline-flex;align-items:center;justify-content:center;font:600 11px/1 var(--font-sans);flex:none}
.av--builder{background:var(--ink);color:var(--paper)}
.av--you{background:var(--surface-subtle);color:var(--ink);border:1px solid var(--line)}
.bar__name{all:unset;font:500 15px/20px var(--font-sans);min-width:0;width:11em;max-width:100%;border-bottom:1px solid transparent}
.bar__name:hover{border-bottom-color:var(--line-strong)}.bar__name:focus{border-bottom-color:var(--slate)}
.bar__sum{font-size:12px;line-height:16px;color:var(--ink-muted)}
.bar__acts{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}

/* Describe */
.describe{max-width:1080px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
.describe h1{font:500 30px/36px var(--font-sans);letter-spacing:-.02em;text-wrap:balance}
.describe__grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:20px;display:grid;gap:16px;min-width:0}
.describe--form{max-width:780px}
.sec{display:grid;gap:14px}
.sec__h{display:flex;gap:10px;align-items:baseline}
.sec__h h2{font:500 18px/24px var(--font-sans);letter-spacing:-.01em}
.sec__n{font:500 12px/18px var(--font-mono);color:var(--ink-faint)}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.start{all:unset;box-sizing:border-box;display:grid;gap:6px;padding:10px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);cursor:pointer;font:500 13px/17px var(--font-sans)}
.start small{font:400 11px/15px var(--font-sans);color:var(--ink-muted)}
.start:hover{background:var(--surface-subtle)}
.start[aria-pressed="true"]{border-color:var(--slate);box-shadow:0 0 0 1px var(--slate);background:var(--slate-tint)}
.start:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.dlist{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:14px 22px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.drow__n{font:500 12px/18px var(--font-mono);color:var(--ink-faint);text-align:right}
.drow--dec{grid-template-columns:14px 22px minmax(0,1fr);align-items:start}
.drow--dec>.grip,.drow--dec>.drow__n{margin-top:12px}
.dec{border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-subtle);padding:10px;display:grid;gap:10px;min-width:0}
.dec__path{display:grid;gap:6px;border-left:2px solid var(--slate);padding:2px 0 2px 10px}
.dec__path--else{border-left-color:var(--line-strong)}
.dec__if{display:grid;grid-template-columns:18px 66px minmax(0,1fr) auto;gap:8px;align-items:center}
.dec__if b{font:500 13px/18px var(--font-sans)}
.sub{display:grid;grid-template-columns:18px 66px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.dec__more{padding-left:100px;display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.dec__more .select{width:auto;height:30px;font-size:13px;padding:0 8px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font:500 13px/18px var(--font-sans);color:var(--ink-muted)}
.stepper span{display:inline-flex;gap:8px;align-items:center;padding:4px 12px 4px 4px;border-radius:var(--radius-pill);border:1px solid transparent}
.stepper i{font:500 11px/18px var(--font-mono);font-style:normal;width:20px;height:20px;border-radius:50%;border:1px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center}
.stepper i .ico{width:12px;height:12px}
.stepper .on{color:var(--ink);background:var(--surface);border-color:var(--line)}
.stepper .on i{background:var(--slate);border-color:var(--slate);color:var(--on-slate)}
.stepper .done i{background:var(--positive-tint);border-color:var(--positive-tint);color:var(--positive)}
.quote{border-left:2px solid var(--line-strong);padding:2px 0 2px 12px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;font-size:13px;line-height:19px;color:var(--ink-muted)}
.quote>span{min-width:0}.quote .linkbtn{white-space:nowrap}
.pv{display:grid;gap:0}
.pv__row{display:grid;grid-template-columns:24px 92px minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.pv__row:first-child{border-top:0}
.pv__n{font:500 12px/18px var(--font-mono);color:var(--ink-faint)}
.pv__sub{grid-column:3;font-size:12px;line-height:17px;color:var(--ink-muted)}

/* Work area: the canvas is its own viewport. Scroll or drag the background to move, zoom with the buttons. */
html.is-build,html.is-build body{height:100%;overflow:hidden}
html.is-build #app{height:100%;display:flex;flex-direction:column}
html.is-build .bar{position:static;flex:none}
.work{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);flex:1 1 auto;min-height:0}
.rail{height:100%;overflow:auto;padding:16px 12px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface);display:grid;gap:8px;align-content:start}
.rail__list{display:grid;gap:6px;padding-top:6px}
.work.is-railoff{grid-template-columns:44px minmax(0,1fr)}
.work.is-railoff .rail{padding:10px 6px;justify-items:center}
.rail__h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rail__tab{all:unset;box-sizing:border-box;writing-mode:vertical-rl;font:500 12px/1 var(--font-sans);color:var(--ink-muted);padding:10px 8px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;gap:8px}
.rail__tab:hover{background:var(--surface-subtle);color:var(--ink)}
.rail__tab:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.tgrp{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.tgrp>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:6px 8px;font:500 13px/17px var(--font-sans)}
.tgrp>summary::-webkit-details-marker{display:none}
.tgrp>summary small{display:block;font:400 11px/14px var(--font-sans);color:var(--ink-muted)}
.tgrp>summary .ico{margin-left:auto;color:var(--ink-faint);transition:transform 120ms}
.tgrp[open]>summary .ico{transform:rotate(90deg)}
.tgrp>summary:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.tgrp .rail__list{padding:0 6px 6px}
.tgrp .block{padding:5px 8px;border-color:transparent;background:var(--surface-subtle)}
.tgrp .block:hover{border-color:var(--line-strong)}
.tool-logo{width:24px;height:24px;border-radius:var(--radius-sm);background:var(--slate-tint);color:var(--slate);font:600 11px/24px var(--font-sans);text-align:center;flex:none}
.rgrp{border-top:1px solid var(--line);padding-top:8px}
.rgrp>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font:500 10px/14px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.rgrp>summary::-webkit-details-marker{display:none}
.rgrp>summary>span{letter-spacing:0;color:var(--ink-faint)}
.rgrp>summary:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.block{box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);cursor:grab;font:500 13px/17px var(--font-sans)}
.block:hover{border-color:var(--line-strong)}
.block .kico{width:24px;height:24px}
.block small{display:block;font:400 11px/14px var(--font-sans);color:var(--ink-muted)}
.block .pill{padding:1px 6px;font-size:10px}
.canvas{min-width:0;height:100%;overflow:auto;cursor:grab;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px;background-attachment:local;transition:margin-right 200ms;overscroll-behavior:contain}
.canvas.is-panning{cursor:grabbing;user-select:none}
.stage{display:flex;justify-content:center;min-width:max-content;padding:20px 480px 45vh}
.col{width:760px;display:grid;grid-template-columns:minmax(0,1fr);gap:0;cursor:default}
.lane .card__top{flex-direction:column;gap:4px}.lane .card__tags{max-width:none;justify-content:flex-start}
body.has-sheet .canvas{margin-right:var(--sheet-w)}
/* The same steps as a list, each with its status */
.canvas--list{cursor:default;background-image:none}
.slist{max-width:860px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.slist>.note{margin:0}
.slist__bar{display:flex;gap:8px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.slist__t{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) 132px 150px;gap:12px;align-items:start;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:13px;line-height:18px}
.srow:first-child{border-top:0}
.srow:hover{background:var(--surface-subtle)}
.srow:focus-visible{outline:2px solid var(--slate);outline-offset:-2px}
.srow.is-sel{background:var(--slate-tint)}
.srow.is-dead .srow__n,.srow.is-dead .srow__name,.srow.is-dead .srow__k{opacity:.55}
.srow--head{cursor:default;font:500 10px/14px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);padding-block:8px;background:var(--surface-subtle)}
.srow--head:hover{background:var(--surface-subtle)}
.srow--path{cursor:pointer;padding-block:6px;background:var(--paper);color:var(--ink-muted);grid-template-columns:44px minmax(0,1fr)}
.srow__n{font:500 12px/18px var(--font-mono);color:var(--ink-faint)}
.srow__name{display:grid;gap:2px;min-width:0}
.srow__name b{font-weight:500;overflow-wrap:anywhere}
.srow__why{font-size:12px;line-height:17px;color:var(--ink-muted)}
.srow__why--risk{color:var(--risk-ink)}
.srow__k{font:500 10.5px/18px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.srow__s{display:flex;gap:4px;flex-wrap:wrap}
.zoomer{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-pop);transition:right 200ms}
.zoomer button{all:unset;box-sizing:border-box;min-width:30px;height:28px;padding:0 8px;border-radius:var(--radius-sm);font:500 12px/28px var(--font-sans);text-align:center;cursor:pointer;font-variant-numeric:tabular-nums}
.zoomer button:hover{background:var(--surface-subtle)}
.zoomer button:focus-visible{outline:2px solid var(--slate);outline-offset:1px}
.zoomer i{width:1px;height:18px;background:var(--line);margin:0 2px}
body.has-sheet .zoomer{right:calc(var(--sheet-w) + 16px)}

.note{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13px;line-height:19px;margin-bottom:16px}
.note>:first-child{flex:1 1 0;min-width:0}.note>:last-child{flex:none}
.note--try{border-color:var(--slate);background:var(--slate-tint);flex-wrap:wrap}.note--try>:first-child{flex:1 1 240px}
.agentline{display:inline-flex;align-items:center;gap:8px;font:500 13px/18px var(--font-sans);color:var(--ink-muted)}
.agentline::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--slate);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.filechip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);font:500 12px/16px var(--font-mono)}

/* ── The Builder (scripted for the prototype) ── */
function placeFor(cond) {
  const words = cond.toLowerCase().match(/[a-z]{4,}/g) || [];
  let hit = -1;
  S.steps.forEach((st, i) => { if (st.kind !== "decision" && words.some((w) => st.name.toLowerCase().includes(w.slice(0, 5)))) hit = i; });
  if (hit >= 0) return hit + 1;

}
function interpret(text, about) {
  const s = text.trim(), l = s.toLowerCase(), here = about && about !== "trigger" ? find(about) : null;
  let m;

    return { text: `I can't loosen approval. A step that changes a tool starts with approval on, and in the trial every write is signed.\nYou can switch this step to run on its own once ${CLIENT} allows it on their connection.` };
  if (/build a skill/.test(l) && here && here.gap) {
    here.gap = false; here.kind = "skill"; here.part = "New skill · being drafted"; here.tool = "";
    (here.open || []).forEach((o) => { if (o.k === "gap") o.done = "Build a skill"; });
    here.decided = [{ what: "A new skill does this, once it is ready", why: "You asked for one. Until it passes a try, a person checks its answer.", f: "" }];
    return { text: `Started a skill for “${here.name}” from parts the library has. I'll draft it from the next example you try.`, changes: [{ s: "~", t: "step now runs a new skill" }] };
  }
  if (/^why|\bwhy (is|did|a|this)/.test(l)) {
    if (/approval/.test(l)) return { text: `Because the step “${(S.steps.find((x) => x.kind === "write") || { name: "that writes" }).name}” changes QuickBooks. Anything that changes a tool starts with approval on. ${SIGNER} signs because they are ${CLIENT}'s default approver.` };
    const t = about === "trigger" ? S.trigger : here;
    if (t && t.decided.length) return { text: t.decided.map((d) => `${d.what}. ${d.why}`).join("\n") };
    if (t) return { text: `It is here because your list says “${t.from || t.name}”. I added nothing you didn't state.` };
    return { text: "Every step comes from a line of your list, in your order. Where it left something open, I took the simplest choice that works and wrote it on the step." };
  }
  if (/who (signs|approves)/.test(l) && here) return { text: `${here.who || SIGNER}. Change it under Approval above, or tell me who.` };
  if (/^(remove|delete)\b/.test(l) && here) {

  }

  }

function ask(text, about) {

/* ── Try it (scripted results; nothing is written) ── */
function startTry() {
  const res = {}, order = [], taken = [];
  let halted = false;
  // The example invoice: one unsure line, one price up 12%, total $4,218.40, not a duplicate.
  const holds = (q) => { const l = q.name.toLowerCase(); let m; if (/match|unsure|confiden/.test(l)) return true; if (/price|cost/.test(l)) return (m = l.match(/(\d+(?:\.\d+)?)\s*%/)) ? 12 > +m[1] : true; if ((m = l.match(/\$\s?([\d,]+)/))) return /under|less|below/.test(l) ? 4218.4 < +m[1].replace(/,/g, "") : 4218.4 > +m[1].replace(/,/g, ""); return false; };
  const put = (id, text, x = {}) => { res[id] = { text, ...x }; order.push(id); };
  put("trigger", `Example: ${S.file}, from Baltic Lumber.`);
  (function run(list) {
    for (let i = 0; i < list.length && !halted; i++) {
      const st = list[i], n = st.name.toLowerCase(), next = list[i + 1];
      const waved = (k) => (st.open || []).some((o) => o.k === k && o.done && !/decision/.test(o.done));
      const about = /match/.test(n) ? /match|unsure|confiden/ : /price|cost|%/;
      let handled = false;
      for (let j = i + 1; j < list.length && list[j].kind === "decision"; j++) if (list[j].paths.some((q) => about.test(q.name.toLowerCase()))) handled = true;
      const forked = handled || waved(/match/.test(n) ? "unsure" : "price");
      const found = (k, text) => { st.open = st.open || []; if (!st.open.some((o) => o.k === k)) st.open.push({ k, type: "Issue", text, why: `Found when you tried ${S.file}. The run went on as if nothing happened.`, opts: [k === "price" ? "Add a decision: ask Dana to approve" : "Add a decision: ask Dana", "Go on without asking"] }); };
      if (!forked && st.kind === "skill" && /match/.test(n)) found("unsure", "A line can be unsure, and nothing says what happens then.");
      if (!forked && st.kind === "skill" && /price|cost/.test(n) && !/match/.test(n)) found("price", "A price can jump past what it flags, and the bill is still made.");
      if (st.kind === "skill" && /match/.test(n)) put(st.id, forked ? "5 of 6 lines matched. 1 is unsure: “3/4 BB ply 4x8”." : "5 of 6 lines matched. 1 is unsure: “3/4 BB ply 4x8”. Nothing says what happens then, so the run went on.", forked ? {} : { tone: "wait", offer: "match" });
      else if (st.kind === "skill" && /price|cost/.test(n)) put(st.id, forked ? "2 prices changed. Baltic birch plywood is up 12%." : "2 prices changed. Baltic birch plywood is up 12%, over the 5% it flags. The run went on to the next step.", forked ? {} : { tone: "wait", offer: "price" });
      else if (st.kind === "skill") put(st.id, /read|extract|parse/.test(n) ? "Read 6 lines. Total $4,218.40. Vendor: Baltic Lumber." : "Done. Its result is kept for the next step.");
      else if (st.kind === "read") put(st.id, "Found 1 record.");
      else if (st.kind === "person") put(st.id, `Ask ${st.who} and wait up to ${st.deadline}. In a try we answer for them: yes.`, { would: 1 });
      else if (st.kind === "write") put(st.id, `${/bill/.test(st.part) ? "Create the bill for $4,218.40 in QuickBooks" : "Make this change in " + (st.tool || "the tool")}${st.approval === "Ask first" ? `, once ${st.who} signs` : ""}. Nothing was written.`, { would: 1 });
      else if (st.kind === "notify") put(st.id, `Tell ${st.to}: 2 prices changed on Baltic Lumber INV-4471.`, { would: 1 });
      else if (st.kind === "wait") put(st.id, `Wait ${st.dur}. Skipped in a try.`, { would: 1 });
      else if (st.kind === "auto") put(st.id, `Ran its ${autoOf(st.part).steps.length} steps: ${autoOf(st.part).steps.map((x) => x[1].charAt(0).toLowerCase() + x[1].slice(1)).join(", ")}. Nothing was sent.`);
      else if (st.kind === "talk") put(st.id, `Message ${st.who} on ${st.where} and wait for an answer. In a try we answer for them.`, { would: 1 });
      else if (st.kind === "askagent") put(st.id, `Ask “${st.agent}”${st.ask ? ": " + st.ask.charAt(0).toLowerCase() + st.ask.slice(1) : ""}. In a try it answers from its last run.`, { would: 1 });
      else if (st.kind === "tellagent") put(st.id, `Send “${st.agent}” what this run found. Not sent in a try.`, { would: 1 });

  S.menu = null;
  if (S.sheet && S.sheet.type === "turnon") S.sheet = null;

  const cv = $("#canvas"); if (cv) cv.scrollTo({ top: 0, behavior: calm ? "auto" : "smooth" });

/* ── Building from the description, one step at a time ── */

  const p = fromForm(blank);

    S.note = `<b style="font-weight:500">Built ${plural(c.steps, "step")} from your list, in your order.</b> Nothing was asked first. ${allOpen().length ? `${plural(allOpen().length, "question or issue", "questions and issues")} sit on the steps they belong to; it runs on defaults until you settle them.` : "Try it, or change anything."}`;
    S.chat.push({ text: `Built ${plural(c.steps, "step")} from your list, in your order. I added nothing you didn't state.\nDecided instead of asking: ${[S.trigger, ...flat()].flatMap((x) => x.decided.map((d) => d.what)).join("; ") || "nothing"}.${allOpen().length ? `\nFor you, on the step each belongs to: ${allOpen().map((x) => x.o.text).join(" ")}` : ""}\nNext: try it on a real invoice, or tell me what to change.` });

    S.chat.push({ text: `Added a decision after “${at.list[at.index].name}” from what the try showed. Change its rule on the canvas.`, changes: [{ s: "+", t: `decision · ${dec.paths[0].name}` }, { s: "+", t: `person step · ${dec.paths[0].steps[0].name}` }], h: S.hist.length });
    startTry();
  },
  fixwith: (d) => { S.sel = d.id; S.sheet = { type: "step" }; renderCanvas(); renderSheet(); const s = $("#say"); if (s) { s.placeholder = "What should it have done on this example?"; s.focus(); } },
  golive: () => { S.live = true; S.sheet = null; renderAll(); toast(`Published v1. The trial started at ${CLIENT}.`); },
};
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]");
  if (S.menu && !e.target.closest("#menu") && !(a && a.dataset.act === "plus")) { S.menu = null; renderMenu(); }
  if (!a || a.disabled) return;

});
let pend = null;
document.addEventListener("focusin", (e) => { if (e.target.dataset && e.target.dataset.f) pend = snap(); });
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "swhen") { S.start.name = t.value; return; }
  if (t.id === "palq") { S.q = t.value; renderRail(true); return; }
  if (t.id === "para") { S.para = t.value; return; }
  const ds = t.dataset || {};
  if (ds.row) {
    const r = S.list.find((x) => x.id === ds.row);
    r.text = t.value;
    const im = t.value.match(/^if\s+(.*)$/i);
    if (im) { const i = S.list.indexOf(r), full = rowFrom(t.value), d = full.t === "decision" ? full : decRow(im[1], ""); S.list.splice(i, 1, d); renderList(d.paths[0].steps[0].text ? `[data-sub="${d.id}|0|0"]` : `[data-cond="${d.id}|0"]`); return; }

  }
  if (ds.cond) { const k = ds.cond.split("|"); S.list.find((x) => x.id === k[0]).paths[+k[1]].cond = t.value; return; }
  if (ds.sub) { const k = ds.sub.split("|"), x = subList(ds.sub).list[+k[2]]; x.text = t.value; const pk = $("#pk-" + x.id); if (pk) pk.outerHTML = kindPill(x.text, x.id); return; }
  if (t.id === "aname" || t.id === "aname2") { S.name = t.value; return; }
  if (t.id === "say") { t.style.height = "auto"; t.style.height = Math.min(120, t.scrollHeight) + "px"; return; }
  if (!t.dataset.f) return;
  const st = find(S.sel);
  if (!st) return;

  else {
    const tf = t.dataset.f, isTool = st.kind === "read" || st.kind === "write";
    if (isTool && tf === "tool") { const tl = TOOLS[t.value], same = st.kind === "write" ? tl.writes[0] || tl.reads[0] : tl.reads[0] || tl.writes[0]; setPart(st, `${t.value} · ${same}`); }
    else if (isTool && tf === "part") setPart(st, t.value);

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "tryfile" && t.files[0]) { S.file = t.files[0].name; startTry(); return; }
  if (t.dataset && t.dataset.conn) { moveTo(S.sel, t.value); return; }

});
document.addEventListener("keydown", (e) => {
  const t = e.target, typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if (t.id === "say" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ACT.send(); return; }
  const ds = t.dataset || {};
  if (S.view === "steps" && (ds.row || ds.cond || ds.sub)) {
    if (e.key === "Enter") {
      e.preventDefault();
      if (ds.row) { const i = S.list.findIndex((x) => x.id === ds.row), r = row(); S.list.splice(i + 1, 0, r); renderList(`[data-row="${r.id}"]`); }
      else if (ds.cond) { const { list } = subList(ds.cond); if (!list.length) list.push(row()); renderList(`[data-sub="${ds.cond}|0"]`); }
      else { const k = ds.sub.split("|"), { list } = subList(ds.sub); list.splice(+k[2] + 1, 0, row()); renderList(`[data-sub="${k[0]}|${k[1]}|${+k[2] + 1}"]`); }
      return;
    }
    if (e.key === "Backspace" && !t.value && (ds.row || ds.sub)) {
      e.preventDefault();
      if (ds.row) { const i = S.list.findIndex((x) => x.id === ds.row), prev = S.list[i - 1]; S.list.splice(i, 1); renderList(prev && prev.t === "step" ? `[data-row="${prev.id}"]` : null); }
      else { const k = ds.sub.split("|"), { list } = subList(ds.sub); list.splice(+k[2], 1); renderList(+k[2] ? `[data-sub="${k[0]}|${k[1]}|${+k[2] - 1}"]` : `[data-cond="${k[0]}|${k[1] === "o" ? 0 : k[1]}"]`); }

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !typing && S.view === "build") { e.preventDefault(); undo(); }
});
// Grab the background to move; Ctrl or ⌘ and the wheel to zoom. A touch screen pans by itself.
let pan = null;
document.addEventListener("pointerdown", (e) => {
  const h = e.target.closest && e.target.closest(".ghandle");
  if (h) {
    e.preventDefault();
    const r = h.getBoundingClientRect();
    link = { from: h.dataset.h, x: r.left + r.width / 2, y: r.top + r.height / 2 };
    hideTip();
    document.body.classList.add("is-linking");
    $("#linker").hidden = false;
    $("#linker path").setAttribute("d", `M${link.x} ${link.y}L${link.x} ${link.y}`);
    return;
  }
  const c = e.target.closest && e.target.closest("#canvas");
  if (!c || S.mode === "list" || e.pointerType === "touch" || (e.button !== 0 && e.button !== 1)) return;
  if (e.button === 0 && e.target.closest(".gnode,button,input,select,textarea,a,label,.note,.res")) return;
  pan = { x: e.clientX, y: e.clientY, l: c.scrollLeft, t: c.scrollTop, c };
  c.classList.add("is-panning");
  e.preventDefault();
});
document.addEventListener("pointermove", (e) => {
  if (!link) return;
  $("#linker path").setAttribute("d", `M${link.x} ${link.y}L${e.clientX} ${e.clientY}`);
  clearOver();
  const el = document.elementFromPoint(e.clientX, e.clientY), n = el && el.closest && el.closest(".gnode");
  if (n && n.dataset.id !== link.from && n.dataset.id !== "trigger") n.classList.add("is-over");
});
document.addEventListener("pointerup", (e) => {
  if (!link) return;
  const from = link.from, el = document.elementFromPoint(e.clientX, e.clientY), n = el && el.closest && el.closest(".gnode");
  link = null; clearOver();
  document.body.classList.remove("is-linking");
  $("#linker").hidden = true;

});
document.addEventListener("pointermove", (e) => { if (pan) { pan.c.scrollLeft = pan.l - (e.clientX - pan.x); pan.c.scrollTop = pan.t - (e.clientY - pan.y); } });
const endPan = () => { if (pan) { pan.c.classList.remove("is-panning"); pan = null; } };
document.addEventListener("pointerup", endPan);
document.addEventListener("pointercancel", endPan);
document.addEventListener("wheel", (e) => {
  const c = e.target.closest && e.target.closest("#canvas");
  if (!c || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();

}, { passive: false });
document.addEventListener("scroll", (e) => { if (e.target.id === "canvas") { hideTip(); if (S.menu) { S.menu = null; renderMenu(); } } }, true);
document.addEventListener("paste", (e) => {

renderAll();
