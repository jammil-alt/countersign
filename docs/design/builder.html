<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mezonas builder prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  Mezonas builder prototype (owner, 2026-11-21): describe it in a paragraph, check the steps the
  Builder reads from it (how it starts, then a line a step; a decision is its own kind of line: If,
  Or if, Otherwise, each path rejoining or ending), then change them on one canvas. Drag steps, add decisions between them, click a step for its whole
  setup with the Builder underneath. Design only: the Builder's answers and the try's results are
  scripted, nothing is saved, and no route is called. Tokens: packages/design-system/tokens.css.
  What it maps to in the code is in the page's own notes ("About this prototype").
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: one sticky bar; a slim rail of step kinds; the flow as one centred column; one sheet on the right. */
:root{
  --font-sans:"Geist",ui-sans-serif,system-ui,sans-serif;--font-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --paper:#FAFAF9;--surface:#FFFFFF;--surface-subtle:#F2F3F2;--line:#E6E8EA;--line-strong:#8A9199;
  --ink:#1A1F26;--ink-muted:#5B636D;--ink-faint:#959CA4;
  --slate:#23415E;--slate-hover:#1A3249;--slate-tint:#EDF1F5;--on-slate:#FFFFFF;
  --copper:#9A4D27;--copper-ink:#7A3D1F;--copper-tint:#F8ECE4;
  --signal:#E3A417;--signal-ink:#6B4C05;--signal-tint:#FBF0D2;
  --risk:#A3302A;--risk-ink:#8A2B26;--risk-tint:#F9E5E3;--risk-line:#EDB9B5;
  --positive:#1F6B4A;--positive-tint:#E2F0E8;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-pill:999px;
  --shadow-xs:0 1px 2px rgba(21,26,33,.08);--shadow-pop:0 8px 24px rgba(21,26,33,.12);--focus-halo:0 0 0 4px rgba(35,65,94,.18);
  --scrim:rgba(21,26,33,.4);
  --bar-h:56px;--rail-w:212px;--sheet-w:452px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1318;--surface:#171C23;--surface-subtle:#1D232B;--line:#2A313A;--line-strong:#6B747E;
  --ink:#E6E9EC;--ink-muted:#9DA5AF;--ink-faint:#6B737D;
  --slate:#8FB0D2;--slate-hover:#A9C3DE;--slate-tint:#1C2A38;--on-slate:#0F1318;
  --copper:#D9895E;--copper-ink:#E3A07C;--copper-tint:#33231A;
  --signal:#E3A417;--signal-ink:#F0C766;--signal-tint:#3A2E10;
  --risk:#E8807A;--risk-ink:#F2A39E;--risk-tint:#3A1C1A;--risk-line:#5A2A27;
  --positive:#7CC4A0;--positive-tint:#17301F;
  --shadow-pop:0 8px 24px rgba(0,0,0,.5);--focus-halo:0 0 0 4px rgba(143,176,210,.25);--scrim:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1318;--surface:#171C23;--surface-subtle:#1D232B;--line:#2A313A;--line-strong:#6B747E;
  --ink:#E6E9EC;--ink-muted:#9DA5AF;--ink-faint:#6B737D;
  --slate:#8FB0D2;--slate-hover:#A9C3DE;--slate-tint:#1C2A38;--on-slate:#0F1318;
  --copper:#D9895E;--copper-ink:#E3A07C;--copper-tint:#33231A;
  --signal:#E3A417;--signal-ink:#F0C766;--signal-tint:#3A2E10;
  --risk:#E8807A;--risk-ink:#F2A39E;--risk-tint:#3A1C1A;--risk-line:#5A2A27;
  --positive:#7CC4A0;--positive-tint:#17301F;
  --shadow-pop:0 8px 24px rgba(0,0,0,.5);--focus-halo:0 0 0 4px rgba(143,176,210,.25);--scrim:rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/20px var(--font-sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
.ico.s20{width:20px;height:20px}
.eyebrow{font:500 10px/14px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.muted{color:var(--ink-muted)}
.small{font-size:13px;line-height:18px}
.grow{flex:1 1 auto;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}

/* Design-system controls (ds-btn, ds-input, ds-seg, ds-pill), as in components/bundle.css */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:var(--radius-md);font:500 13px/1 var(--font-sans);cursor:pointer;white-space:nowrap;transition:background 160ms}
.btn:focus-visible,.seg button:focus-visible,.plus:focus-visible,.card:focus-visible,.block:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.btn--pri{background:var(--slate);color:var(--on-slate)}.btn--pri:hover{background:var(--slate-hover)}
.btn--sec{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}.btn--sec:hover{background:var(--surface-subtle)}
.btn--ghost{color:var(--ink)}.btn--ghost:hover{background:var(--surface-subtle)}
.btn--sm{height:30px;padding:0 12px;font-size:12px}
.btn--icon{width:30px;height:30px;padding:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{all:unset;color:var(--slate);font:500 13px/18px var(--font-sans);cursor:pointer}.linkbtn:hover{text-decoration:underline}
.input,.select,.textarea{width:100%;height:36px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font:400 14px/1.4 var(--font-sans)}
.textarea{height:auto;padding:8px 12px;resize:vertical;line-height:20px}
.input::placeholder,.textarea::placeholder{color:var(--ink-faint)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--slate);box-shadow:var(--focus-halo)}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface-subtle);border:1px solid var(--line);border-radius:var(--radius-md);max-width:100%;flex-wrap:wrap}
.seg button{all:unset;padding:6px 12px;border-radius:var(--radius-sm);font:500 13px/1 var(--font-sans);color:var(--ink-muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-xs)}
.seg button[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;font:500 11px/14px var(--font-sans);white-space:nowrap;border:1px solid;border-radius:var(--radius-pill)}
.pill--neutral{color:var(--ink-muted);background:var(--surface-subtle);border-color:var(--line)}
.pill--accent{color:var(--slate);background:var(--slate-tint);border-color:var(--slate-tint)}
.pill--person{color:var(--copper-ink);background:var(--copper-tint);border-color:var(--copper-tint)}
.pill--wait{color:var(--signal-ink);background:var(--signal-tint);border-color:var(--signal)}
.pill--ok{color:var(--positive);background:var(--positive-tint);border-color:var(--positive-tint)}
.field{display:grid;gap:6px}
.field>label,.label{font:500 13px/16px var(--font-sans);color:var(--ink)}
.help{font-size:12px;line-height:17px;color:var(--ink-muted)}
.switch{all:unset;width:32px;height:18px;border-radius:var(--radius-pill);background:var(--line-strong);padding:2px;box-sizing:border-box;display:inline-flex;flex:none;cursor:pointer;transition:background 160ms}
.switch::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform 160ms}
.switch[aria-checked="true"]{background:var(--slate)}.switch[aria-checked="true"]::after{transform:translateX(14px)}

/* Bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar__in{display:flex;align-items:center;gap:12px;min-height:var(--bar-h);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.mark{width:22px;height:22px;color:var(--slate);flex:none}
.crumb{font-size:13px;color:var(--ink-muted);white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;background:var(--slate);color:var(--on-slate);display:inline-flex;align-items:center;justify-content:center;font:600 11px/1 var(--font-sans);flex:none}
.av--builder{background:var(--ink);color:var(--paper)}
.av--you{background:var(--surface-subtle);color:var(--ink);border:1px solid var(--line)}
.bar__name{all:unset;font:500 15px/20px var(--font-sans);min-width:0;width:11em;max-width:100%;border-bottom:1px solid transparent}
.bar__name:hover{border-bottom-color:var(--line-strong)}.bar__name:focus{border-bottom-color:var(--slate)}
.bar__sum{font-size:12px;line-height:16px;color:var(--ink-muted)}
.bar__acts{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}

/* Describe */
.describe{max-width:1080px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
.describe h1{font:500 30px/36px var(--font-sans);letter-spacing:-.02em;text-wrap:balance}
.describe__grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:20px;display:grid;gap:16px;min-width:0}
.describe--form{max-width:780px}
.sec{display:grid;gap:14px}
.sec__h{display:flex;gap:10px;align-items:baseline}
.sec__h h2{font:500 18px/24px var(--font-sans);letter-spacing:-.01em}
.sec__n{font:500 12px/18px var(--font-mono);color:var(--ink-faint)}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.start{all:unset;box-sizing:border-box;display:grid;gap:6px;padding:10px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);cursor:pointer;font:500 13px/17px var(--font-sans)}
.start small{font:400 11px/15px var(--font-sans);color:var(--ink-muted)}
.start:hover{background:var(--surface-subtle)}
.start[aria-pressed="true"]{border-color:var(--slate);box-shadow:0 0 0 1px var(--slate);background:var(--slate-tint)}
.start:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.dlist{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:14px 22px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.drow__n{font:500 12px/18px var(--font-mono);color:var(--ink-faint);text-align:right}
.drow--dec{grid-template-columns:14px 22px minmax(0,1fr);align-items:start}
.drow--dec>.grip,.drow--dec>.drow__n{margin-top:12px}
.dec{border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-subtle);padding:10px;display:grid;gap:10px;min-width:0}
.dec__path{display:grid;gap:6px;border-left:2px solid var(--slate);padding:2px 0 2px 10px}
.dec__path--else{border-left-color:var(--line-strong)}
.dec__if{display:grid;grid-template-columns:18px 66px minmax(0,1fr) auto;gap:8px;align-items:center}
.dec__if b{font:500 13px/18px var(--font-sans)}
.sub{display:grid;grid-template-columns:18px 66px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.dec__more{padding-left:100px;display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.dec__more .select{width:auto;height:30px;font-size:13px;padding:0 8px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font:500 13px/18px var(--font-sans);color:var(--ink-muted)}
.stepper span{display:inline-flex;gap:8px;align-items:center;padding:4px 12px 4px 4px;border-radius:var(--radius-pill);border:1px solid transparent}
.stepper i{font:500 11px/18px var(--font-mono);font-style:normal;width:20px;height:20px;border-radius:50%;border:1px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center}
.stepper i .ico{width:12px;height:12px}
.stepper .on{color:var(--ink);background:var(--surface);border-color:var(--line)}
.stepper .on i{background:var(--slate);border-color:var(--slate);color:var(--on-slate)}
.stepper .done i{background:var(--positive-tint);border-color:var(--positive-tint);color:var(--positive)}
.quote{border-left:2px solid var(--line-strong);padding:2px 0 2px 12px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;font-size:13px;line-height:19px;color:var(--ink-muted)}
.quote>span{min-width:0}.quote .linkbtn{white-space:nowrap}
.pv{display:grid;gap:0}
.pv__row{display:grid;grid-template-columns:24px 92px minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.pv__row:first-child{border-top:0}
.pv__n{font:500 12px/18px var(--font-mono);color:var(--ink-faint)}
.pv__sub{grid-column:3;font-size:12px;line-height:17px;color:var(--ink-muted)}

/* Work area */
.work{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr)}
.rail{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - var(--bar-h));overflow:auto;padding:16px 12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface);min-height:calc(100vh - var(--bar-h));display:grid;gap:6px;align-content:start}
.rail__list{display:grid;gap:6px}
.block{box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);cursor:grab;font:500 13px/18px var(--font-sans)}
.block:hover{border-color:var(--line-strong)}
.block .kico{width:24px;height:24px}
.block small{display:block;font:400 11px/14px var(--font-sans);color:var(--ink-muted)}
.canvas{min-width:0;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px;min-height:calc(100vh - var(--bar-h));transition:padding-right 200ms}
.col{max-width:860px;margin:0 auto;display:grid;gap:0}
body.has-sheet .canvas{padding-right:calc(var(--sheet-w) + 16px)}

.note{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13px;line-height:19px;margin-bottom:16px}
.note>:first-child{flex:1 1 0;min-width:0}.note>:last-child{flex:none}
.note--try{border-color:var(--slate);background:var(--slate-tint);flex-wrap:wrap}.note--try>:first-child{flex:1 1 240px}
.agentline{display:inline-flex;align-items:center;gap:8px;font:500 13px/18px var(--font-sans);color:var(--ink-muted)}
.agentline::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--slate);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.filechip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);font:500 12px/16px var(--font-mono)}

/* Flow */
.flow{display:flex;flex-direction:column;min-height:8px}
.lane>.flow{flex:1 1 auto;padding:10px 10px 4px}
.lane__empty{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px dashed var(--line-strong);border-radius:var(--radius-sm);font-size:12px;color:var(--ink-muted);margin-top:8px}
.flow:has(>.node)>.lane__empty,.flow:has(>.block)>.lane__empty{display:none}
.node{position:relative;padding-top:26px}
.node::before{content:"";position:absolute;left:50%;top:0;height:26px;width:1px;background:var(--line-strong)}
.lane .node{padding-top:20px}.lane .node::before{height:20px}
.lane__h+.node{padding-top:8px}.lane__h+.node::before{display:none}
.lane__h+.node>.plus{display:none}
.plus{all:unset;box-sizing:border-box;position:absolute;left:50%;top:3px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1}
.lane .plus{top:0}
.plus:hover,.plus[aria-expanded="true"]{background:var(--slate);border-color:var(--slate);color:var(--on-slate)}
.plus .ico{width:12px;height:12px}
.card{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:start;width:100%;padding:12px 14px 12px 8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);cursor:pointer;position:relative}
.card:hover{border-color:var(--line-strong)}
.node.is-sel>.card,.node.is-sel>.fork>.card,.trig.is-sel{border-color:var(--slate);box-shadow:0 0 0 1px var(--slate)}
.grip{width:14px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);cursor:grab}
.grip .ico{width:14px;height:14px}
.kico{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;background:var(--surface-subtle);color:var(--ink-muted);flex:none;position:relative}
.kico--write{background:var(--slate);color:var(--on-slate)}
.kico--person{background:var(--copper-tint);color:var(--copper-ink)}
.kico--decision,.kico--each{background:var(--slate-tint);color:var(--slate)}
.card__main{display:grid;gap:2px;min-width:0}
.card__top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.card__name{font:500 14px/20px var(--font-sans);overflow-wrap:anywhere}
.card__name .n{font:500 12px/20px var(--font-mono);color:var(--ink-faint);margin-right:8px}
.node--person>.card .card__name b{color:var(--copper-ink)}
.card__name b{font-weight:500}
.card__sub{font-size:12px;line-height:17px;color:var(--ink-muted);overflow-wrap:anywhere}
.card__sub .eyebrow{margin-right:6px}
.card__tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:50%}
.res{margin-top:8px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--surface-subtle);font-size:13px;line-height:18px;display:grid;gap:6px;animation:rise 260ms ease-out both}
.res__h{display:flex;gap:8px;align-items:flex-start}
.res--wait{background:var(--signal-tint);color:var(--ink)}
.res__acts{display:flex;gap:12px;flex-wrap:wrap}
.node.is-off{opacity:.45}
.trig{background:var(--slate-tint);border-color:var(--slate-tint);grid-template-columns:auto minmax(0,1fr);padding-left:14px}
.trig:hover{border-color:var(--slate)}
.trig .kico{background:var(--surface);color:var(--slate)}
.fork{border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface)}
.fork>.card{border:0;border-radius:var(--radius-md) var(--radius-md) 0 0;background:transparent}
.node.is-sel>.fork{border-color:var(--slate);box-shadow:0 0 0 1px var(--slate)}
.node.is-sel>.fork>.card{box-shadow:none}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;padding:0 8px 8px;position:relative}
.lanes--split{padding-top:18px}
.lanes--split::before{content:"";position:absolute;left:50%;top:0;height:9px;width:1px;background:var(--line-strong)}
.lanes--split>.lane{position:relative}
.lanes--split>.lane::before{content:"";position:absolute;left:50%;top:-9px;height:9px;width:1px;background:var(--line-strong)}
.lanes--split>.lane::after{content:"";position:absolute;top:-9px;left:-4px;right:-4px;height:1px;background:var(--line-strong)}
.lanes--split>.lane:first-child::after{left:50%}.lanes--split>.lane:last-child::after{right:50%}
.lane .lanes{grid-template-columns:minmax(0,1fr)!important;padding-top:0}
.lane .lanes--split::before,.lane .lanes--split>.lane::before,.lane .lanes--split>.lane::after{display:none}
.lane .lane{border-left:2px solid var(--slate);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.lane.is-taken{box-shadow:inset 0 0 0 1px var(--positive)}
.lane__foot{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:6px 10px 10px;font-size:12px;line-height:16px}
.lane__foot .linkbtn{font-size:12px;line-height:16px}
.lane__end{display:inline-flex;gap:8px;align-items:center;color:var(--ink-muted)}
.lane__end .ico{width:12px;height:12px}

.toast{position:fixed;z-index:50;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--radius-sm);font:500 13px/18px var(--font-sans);box-shadow:var(--shadow-pop);max-width:calc(100% - 32px)}

@media (max-width:1180px){body.has-sheet .canvas{padding-right:max(16px,env(safe-area-inset-right,0px))}}

  .work{grid-template-columns:minmax(0,1fr)}.rail{display:none}
  .describe__grid{grid-template-columns:minmax(0,1fr)}
  .sheet{top:0;z-index:45;width:100%;border-left:0;padding-top:env(safe-area-inset-top,0px)}

  .lanes{grid-template-columns:minmax(0,1fr)!important}.lanes--split::before,.lanes--split>.lane::before,.lanes--split>.lane::after{display:none}
  .pv__row{grid-template-columns:20px minmax(0,1fr)}.pv__row .pill{justify-self:start;grid-column:2}.pv__row b{grid-column:2}.pv__sub{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
"use strict";
/* ── Sample data: Harbor Millwork, Purchasing. Everything here is an example. ── */
const CLIENT = "Harbor Millwork", SIGNER = "Dana Whitfield";
const STARTS = [
  { starts: "A document arrives", hint: "An invoice, a receipt, a file", name: "When a vendor invoice arrives by email", detail: "Forwarded email · ap@harbormillwork.mezonas.com" },
  { starts: "On a schedule", hint: "Every day, every week", name: "Every weekday at 7:00", detail: "Weekdays at 7:00" },
  { starts: "A record changes", hint: "Something new or changed in a tool", name: "When a bill is created in QuickBooks", detail: "QuickBooks · bill created" },
  { starts: "A message arrives", hint: "An email, a text, a WhatsApp", name: "When someone on the team sends a message", detail: "Texts and WhatsApp" },
  { starts: "A person starts it", hint: "By hand, when they choose", name: "When someone starts it by hand", detail: "From the agent's page" },
];
const PARA = "When a vendor invoice arrives by email, read the invoice and match each line to our item list. If the invoice is a duplicate, tell Dana it is a duplicate and stop. If a line doesn't match, ask Dana which item it is. Code each line to a job, then check each price against the last price we paid. If the document is a credit memo, apply the credit to the vendor's open bill and tell Dana, otherwise create the bill in QuickBooks and tell Dana what changed.";
const row = (text) => ({ id: nid(), t: "step", text: text || "" });
const decRow = (cond, then) => ({ id: nid(), t: "decision", paths: [{ cond: cond || "", steps: [row(then)], end: "on" }], otherwise: [], oend: "on" });
const PEOPLE = [SIGNER, "Lisa Park", "Harbor Millwork's admins", "Your Mezonas lead"];
const PARTS = {
  read: ["Purchasing · read the item list", "Purchasing · read last prices", "QuickBooks · find a bill", "QuickBooks · find a vendor", "Documents · find a document"],
  skill: ["Read a document", "Match items across vendors", "Track price changes", "Find supporting document", "Reconcile two lists", "Write a summary"],
  write: ["QuickBooks · create bill", "QuickBooks · update bill", "QuickBooks · create vendor", "Gmail · send email", "Texts · send text", "Google Drive · save a file", "Purchasing · save to the item list"],
};
const FIELDS = ["Match confidence", "Price change", "Total", "Vendor", "How the step before ended"];
const OPS = [">", "≥", "<", "≤", "is", "is not", "contains"];
const K = {
  trigger: { label: "Starts when", ico: "arrow" },
  read: { label: "Read", ico: "search", hint: "Looks something up. Changes nothing.", blank: "Look something up" },
  skill: { label: "Skill", ico: "worksheet", hint: "Does a piece of work from the library.", blank: "Do a piece of work" },
  write: { label: "Change a tool", ico: "sign", hint: "Writes into the client's tool. Approval starts on.", blank: "Change something in a tool" },
  person: { label: "Person", ico: "lead", hint: "Someone approves or answers.", blank: "Ask a person" },
  notify: { label: "Tell someone", ico: "message", hint: "Your team or the client's.", blank: "Tell someone" },
  decision: { label: "Decision", ico: "fork", hint: "Paths with rules. The first that matches runs.", blank: "Decide what happens" },
  each: { label: "For each", ico: "loop", hint: "Runs its steps once per item.", blank: "For each item" },
  wait: { label: "Wait", ico: "clock", hint: "Pauses for a while.", blank: "Wait" },
  stop: { label: "Stop", ico: "stop", hint: "Ends the run here.", blank: "Stop here" },
};
const ADDABLE = ["read", "skill", "write", "person", "notify", "decision", "each", "wait", "stop"];
const ICONS = {
  add: '<path d="M12 5v14 M5 12h14"/>', alert: '<path d="M12 3.5l9.5 16.5h-19z M12 10v4.5"/><circle fill="currentColor" stroke="none" cx="12" cy="17.25" r="1"/>',
  arrow: '<path d="M4 12h16 M14 6l6 6-6 6"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', close: '<path d="M6 6l12 12 M18 6L6 18"/>',
  search: '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/>', worksheet: '<path d="M4 6.5l1.5 1.5L8 5.5 M11 7h9 M4 12.5l1.5 1.5L8 11.5 M11 13h9 M4 18.5h4 M11 18.5h9"/>',
  sign: '<path d="M14.5 4.5l3 3L9 16H6v-3z"/><path d="M4 20h16"/>', lead: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/>',
  message: '<path d="M4 5h16v11H9l-5 4z M8 9h8 M8 12h5"/>', fork: '<path d="M12 3.5l8.5 8.5-8.5 8.5L3.5 12z"/>',
  loop: '<path d="M5 11a7 7 0 0 1 12.5-3.5L19 9 M19 5v4h-4 M19 13a7 7 0 0 1-12.5 3.5L5 15 M5 19v-4h4"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="1"/>',
  grip: '<circle fill="currentColor" stroke="none" cx="9" cy="6" r="1.3"/><circle fill="currentColor" stroke="none" cx="15" cy="6" r="1.3"/><circle fill="currentColor" stroke="none" cx="9" cy="12" r="1.3"/><circle fill="currentColor" stroke="none" cx="15" cy="12" r="1.3"/><circle fill="currentColor" stroke="none" cx="9" cy="18" r="1.3"/><circle fill="currentColor" stroke="none" cx="15" cy="18" r="1.3"/>',
  undo: '<path d="M8 6l-4 4 4 4 M4 10h10.5a4.5 4.5 0 0 1 0 9H11"/>', info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle fill="currentColor" stroke="none" cx="12" cy="7.75" r="1"/>',
  upload: '<path d="M12 15V4 M7 9l5-5 5 5 M4 15v5h16v-5"/>', send: '<path d="M12 19V5 M6 11l6-6 6 6"/>',
};
const ic = (n, c = "") => `<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ""}</svg>`;
const MARK = '<svg class="mark" viewBox="0 0 48 48" fill="currentColor" role="img" aria-label="Mezonas"><rect x="12" y="14" width="24" height="20" rx="2"/><rect x="15" y="6" width="7" height="4" rx="1"/><rect x="26" y="6" width="7" height="4" rx="1"/><rect x="15" y="38" width="7" height="4" rx="1"/><rect x="26" y="38" width="7" height="4" rx="1"/><rect x="4" y="20.5" width="4" height="7" rx="1"/><rect x="40" y="20.5" width="4" height="7" rx="1"/></svg>';

let uid = 0;
const nid = () => "s" + ++uid;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const plural = (n, w, ws) => `${n} ${n === 1 ? w : ws || w + "s"}`;
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

const S = {
  view: "describe", name: "Invoice intake", para: PARA, fromPara: false, drafting: false, start: { starts: STARTS[0].starts, name: STARTS[0].name }, list: [], trigger: null, steps: [], sel: null, sheet: null, menu: null,
  hist: [], chat: [], busy: false, try: null, tried: false, live: false, note: null, building: null, file: "Baltic-Lumber-INV-4471.pdf",
};
const fresh = new Set();

/* ── Steps: make, guess from words, find ── */
function mk(kind, name, x = {}) {
  const s = { id: nid(), kind, name: name || K[kind].blank, from: "", decided: [], open: [], onError: "Stop the run" };
  if (kind === "read") Object.assign(s, { part: PARTS.read[4], tool: "Documents" });
  if (kind === "skill") Object.assign(s, { part: "The Builder picks from the library", tool: "" });
  if (kind === "write") Object.assign(s, { part: PARTS.write[0], tool: "QuickBooks", approval: "Ask first", who: SIGNER });
  if (kind === "person") Object.assign(s, { mode: "Answer", who: SIGNER, where: "Inbox", deadline: "3 days", noAnswer: "Stop the run and tell us" });
  if (kind === "notify") Object.assign(s, { to: SIGNER, where: "Inbox", message: "" });
  if (kind === "decision") Object.assign(s, { decide: "A rule", who: SIGNER, paths: [{ id: nid(), name: "Path A", rule: { field: "", op: ">", value: "" }, steps: [] }, { id: nid(), name: "Otherwise", rule: null, steps: [] }] });
  if (kind === "each") Object.assign(s, { over: "the list from the step before", paths: [{ id: nid(), name: "Each item", rule: null, each: true, steps: [] }] });
  if (kind === "wait") s.dur = "2 days";
  if (kind === "stop") s.as = "Succeeded";
  return Object.assign(s, x);
}
const clean = (line) => line.replace(/^\s*(\d+[.)]|[-*•])\s*/, "").trim().replace(/[.;]$/, "");
function guess(words) {
  const t = clean(words), l = t.toLowerCase();
  let m;
  if ((m = t.match(/^if (.+?)(?:,| then) (.+)$/i))) return decisionFrom(m[1], m[2], t);
  if ((m = t.match(/^for each ([^,]+),? (.+)$/i))) {
    const e = mk("each", cap(`For each ${m[1]}`), { from: t, over: m[1] });
    e.paths[0].steps.push(guess(m[2]));
    return e;
  }
  if (/^wait\b/.test(l)) return mk("wait", cap(t), { from: t, dur: (l.match(/\d+ \w+/) || ["2 days"])[0] });
  if (/^(stop|end)\b/.test(l)) return mk("stop", cap(t), { from: t });
  if (/^(ask|have .+ (approve|review|check|sign)|get .+ (approval|sign))/.test(l)) {
    const approve = /approve|sign|ok\b|okay/.test(l);
    return mk("person", cap(t), { from: t, mode: approve ? "Approve" : "Answer", who: who(l), decided: [{ what: "Waits up to 3 days, then stops and tells you", why: "No deadline was given, so it stops rather than going ahead.", f: "deadline" }] });
  }
  if (/^(tell|notify|alert|let .+ know|remind|report to)/.test(l))
    return mk("notify", cap(t), { from: t, to: who(l), message: "What changed on this invoice, with the lines it came from.", decided: [{ what: "Sent to the inbox", why: "No channel was given.", f: "where" }] });
  if (/^(create|update|add|post|send|attach|file|save|record|enter|mark|email|text|upload|apply)\b/.test(l)) {
    let part = "QuickBooks · update bill";
    if (/vendor/.test(l) && /create|add/.test(l)) part = "QuickBooks · create vendor";
    else if (/bill|invoice/.test(l)) part = /update|attach|mark|apply/.test(l) ? "QuickBooks · update bill" : "QuickBooks · create bill";
    else if (/email|send/.test(l)) part = "Gmail · send email";
    else if (/text|sms/.test(l)) part = "Texts · send text";
    else if (/folder|drive/.test(l)) part = "Google Drive · save a file";

      if (!forked && st.kind === "skill" && /match/.test(n)) found("unsure", "A line can be unsure, and nothing says what happens then.");
      if (!forked && st.kind === "skill" && /price|cost/.test(n) && !/match/.test(n)) found("price", "A price can jump past what it flags, and the bill is still made.");
      if (st.kind === "skill" && /match/.test(n)) put(st.id, forked ? "5 of 6 lines matched. 1 is unsure: “3/4 BB ply 4x8”." : "5 of 6 lines matched. 1 is unsure: “3/4 BB ply 4x8”. Nothing says what happens then, so the run went on.", forked ? {} : { tone: "wait", offer: "match" });
      else if (st.kind === "skill" && /price|cost/.test(n)) put(st.id, forked ? "2 prices changed. Baltic birch plywood is up 12%." : "2 prices changed. Baltic birch plywood is up 12%, over the 5% it flags. The run went on to the next step.", forked ? {} : { tone: "wait", offer: "price" });
      else if (st.kind === "skill") put(st.id, /read|extract|parse/.test(n) ? "Read 6 lines. Total $4,218.40. Vendor: Baltic Lumber." : "Done. Its result is kept for the next step.");
      else if (st.kind === "read") put(st.id, "Found 1 record.");
      else if (st.kind === "person") put(st.id, `Ask ${st.who} and wait up to ${st.deadline}. In a try we answer for them: yes.`, { would: 1 });
      else if (st.kind === "write") put(st.id, `${/bill/.test(st.part) ? "Create the bill for $4,218.40 in QuickBooks" : "Make this change in " + (st.tool || "the tool")}${st.approval === "Ask first" ? `, once ${st.who} signs` : ""}. Nothing was written.`, { would: 1 });
      else if (st.kind === "notify") put(st.id, `Tell ${st.to}: 2 prices changed on Baltic Lumber INV-4471.`, { would: 1 });
      else if (st.kind === "wait") put(st.id, `Wait ${st.dur}. Skipped in a try.`, { would: 1 });
      else if (st.kind === "stop") { put(st.id, "The run ends here."); halted = true; }
      else if (st.kind === "each") { put(st.id, "6 items. Its steps ran for each."); run(st.paths[0].steps); }
      else if (st.kind === "decision") { const p = st.paths.find((q) => q.rule && holds(q)) || st.paths[st.paths.length - 1]; taken.push(p.id); if (!p.rule) { put(st.id, "Took Otherwise. None of the paths above fit this example."); run(p.steps); } else if (st.decide === "A person") put(st.id, `Ask ${st.who} to pick a path. In a try we pick the one that fits: “${p.name}”.`, { would: 1 }); else put(st.id, `Took “${p.name}”${st.decide === "The agent" ? ". The agent judged it from the step before" : p.rule && p.rule.field ? ` (${p.rule.field} ${p.rule.op} ${p.rule.value})` : ""}.`); run(p.steps); }
    }
  })(S.steps);
  S.try = { res, order, taken, shown: 0, done: false };
  S.menu = null;
  if (S.sheet && S.sheet.type === "turnon") S.sheet = null;
  renderAll();
  scrollTo({ top: 0, behavior: calm ? "auto" : "smooth" });
  clearInterval(startTry.t);
  const step = () => {
    const t = S.try;
    if (!t) return clearInterval(startTry.t);
    t.shown++;
    if (t.shown >= t.order.length) { t.done = true; S.tried = true; clearInterval(startTry.t); }
    renderCanvas();
    const el = document.querySelector(t.order[t.shown - 1] === "trigger" ? ".trig" : `.node[data-id="${t.order[t.shown - 1]}"]`);
    if (el && !calm) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  };
  if (calm) { S.try.shown = order.length; S.try.done = true; S.tried = true; renderCanvas(); }
  else startTry.t = setInterval(step, 480);
}

/* ── Building from the description, one step at a time ── */
function build(blank) {
  const p = fromForm(blank);
  Object.assign(S, { view: "build", trigger: p.trigger, steps: [], sel: null, sheet: null, hist: [], chat: [], try: null, tried: false, live: false, note: null });
  const finish = () => {
    S.building = null;
    const c = counts();
    if (blank) { S.note = null; renderAll(); return; }
    S.note = `<b style="font-weight:500">Built ${plural(c.steps, "step")} from your list, in your order.</b> Nothing was asked first. ${allOpen().length ? `${plural(allOpen().length, "question or issue", "questions and issues")} sit on the steps they belong to; it runs on defaults until you settle them.` : "Try it, or change anything."}`;
    S.chat.push({ text: `Built ${plural(c.steps, "step")} from your list, in your order. I added nothing you didn't state.\nDecided instead of asking: ${[S.trigger, ...flat()].flatMap((x) => x.decided.map((d) => d.what)).join("; ") || "nothing"}.${allOpen().length ? `\nFor you, on the step each belongs to: ${allOpen().map((x) => x.o.text).join(" ")}` : ""}\nNext: try it on a real invoice, or tell me what to change.` });
    renderAll();
  };
  if (calm || blank || !p.steps.length) { S.steps = p.steps; S.building = null; renderAll(); finish(); return; }
  S.building = { queue: p.steps.slice(), total: p.steps.length };
  renderAll();
  const t = setInterval(() => {
    const st = S.building.queue.shift();
    S.steps.push(st);
    fresh.add(st.id);
    if (!S.building.queue.length) { clearInterval(t); finish(); return; }
    renderCanvas(); renderBar();
  }, 420);
}
const flat = () => { const a = []; walk(S.steps, (st) => a.push(st)); return a; };

/* ── Events ── */
const ACT = {
  build: () => build(false),
  blank: () => build(true),
  restart: () => { Object.assign(S, { view: "steps", sheet: null, sel: null, menu: null, try: null, building: null }); renderAll(); scrollTo(0, 0); },
  draft: () => { if (!S.para.trim()) return toast("Write a few sentences first."); S.drafting = true; renderAll(); setTimeout(() => { const pp = parsePara(S.para); Object.assign(S, { drafting: false, start: pp.start, list: pp.list, fromPara: true, view: "steps" }); renderAll.anim = !calm; renderAll(); scrollTo(0, 0); }, calm ? 0 : 900); },
  mylist: () => { Object.assign(S, { fromPara: false, list: [row()], view: "steps" }); renderAll(); scrollTo(0, 0); },
  backdesc: () => { S.view = "describe"; renderAll(); scrollTo(0, 0); },
  pathend: (d) => { const q = pathById(d.p); if (!q || pathEnds(q) === (d.v === "stop")) return; commit(); if (d.v === "stop") closePath(q); else openPath(q); S.try = null; renderCanvas(); renderBar(); renderSheet(); },
  split: (d) => { const st = find(d.id); if (!st || allEnd(st)) return; commit(); st.paths.forEach(closePath); S.try = null; S.sel = st.id; S.sheet = { type: "step" }; renderCanvas(); renderBar(); renderSheet(); },
  unsplit: (d) => { const st = find(d.id); if (!st || !st.paths.some(pathEnds)) return; commit(); st.paths.forEach(openPath); S.try = null; renderCanvas(); renderBar(); renderSheet(); },
  dafter: (d) => { const r = S.list.find((x) => x.id === d.id); r.paths.forEach((q) => (q.end = d.v)); r.oend = d.v; renderList(); },
  dmove: (d) => { const [rid, pk] = d.k.split("|"), i = S.list.findIndex((x) => x.id === rid), r = S.list[i], tail = S.list.slice(i + 1).filter((x) => x.t === "step"); S.list = S.list.filter((x) => !tail.includes(x)); (pk === "o" ? r.otherwise : r.paths[+pk].steps).push(...tail); renderList(); },
  dstart: (d) => { const cur = STARTS.find((x) => x.starts === S.start.starts), nx = STARTS.find((x) => x.starts === d.v); if (!S.start.name.trim() || S.start.name === cur.name) S.start.name = nx.name; S.start.starts = nx.starts; renderAll(); },
  dadd: () => { const r = row(); S.list.push(r); renderList(`[data-row="${r.id}"]`); },
  dadddec: () => { const r = decRow("", ""); S.list.push(r); renderList(`[data-cond="${r.id}|0"]`); },
  drm: (d) => { S.list = S.list.filter((x) => x.id !== d.id); renderList(); },
  dsubadd: (d) => { const { list } = subList(d.k); list.push(row()); renderList(`[data-sub="${d.k}|${list.length - 1}"]`); },
  dsubrm: (d) => { const k = d.k.split("|"), { list } = subList(d.k); list.splice(+k[2], 1); renderList(); },
  dpathadd: (d) => { const r = S.list.find((x) => x.id === d.id); r.paths.push({ cond: "", steps: [row()], end: "on" }); renderList(`[data-cond="${r.id}|${r.paths.length - 1}"]`); },
  dpathrm: (d) => { const k = d.k.split("|"), r = S.list.find((x) => x.id === k[0]); r.paths.splice(+k[1], 1); renderList(); },
  open: (d) => { S.sel = d.id; S.sheet = { type: "step" }; renderCanvas(); renderSheet(); },
  close: () => { S.sheet = null; S.sel = null; if (S.view === "build") renderCanvas(); renderSheet(); },
  sheet: (d) => { S.sheet = { type: d.type }; S.sel = null; if (S.view === "build") renderCanvas(); renderSheet(); if (d.type === "builder") { const s = $("#say"); if (s) s.focus(); } },
  plus: (d, el) => {
    const r = el.getBoundingClientRect(), same = S.menu && S.menu.list === d.list && S.menu.index === +d.index;
    S.menu = same ? null : { list: d.list, index: +d.index, x: Math.max(8, Math.min(innerWidth - 256, r.left + r.width / 2 - 124)), y: r.bottom + 6 };
    renderMenu();
  },
  addkind: (d) => { const m = S.menu; if (m) addStep(d.kind, m.list, m.index); },
  paladd: (d) => { if (!dragged) addStep(d.kind, "root", S.steps.length); },
  undo: () => undo(),
  chatundo: () => undo(),
  dismiss: () => { S.note = null; renderCanvas(); },
  send: () => { const s = $("#say"); if (s) ask(s.value, S.sheet && S.sheet.type === "step" ? S.sel : null); },
  chip: (d, el) => ask(el.textContent, S.sheet && S.sheet.type === "step" ? S.sel : null),
  remove: (d) => { const at = locate(d.id); if (!at) return; commit(); at.list.splice(at.index, 1); S.sel = null; S.sheet = null; S.try = null; renderAll(); toast("Step removed. Undo brings it back."); },
  seg: (d) => { const st = find(S.sel); if (!st) return; commit(); st[d.f] = d.v; renderCanvas(); renderBar(); renderSheet(); },
  sw: (d, el) => el.setAttribute("aria-checked", el.getAttribute("aria-checked") !== "true"),
  focusf: (d) => { const el = document.querySelector(`#sbody [data-f="${d.f}"]`); if (el) { el.scrollIntoView({ block: "center" }); el.focus(); } },
  addpath: () => { const st = find(S.sel); if (!st) return; commit(); st.paths.splice(st.paths.length - 1, 0, { id: nid(), name: `Path ${String.fromCharCode(64 + st.paths.length)}`, rule: { field: "", op: ">", value: "" }, steps: [] }); renderCanvas(); renderSheet(); const ins = document.querySelectorAll('#sbody [data-f="name"]'), el = ins[ins.length - 1]; if (el) { el.focus(); el.select(); } },
  rmpath: (d) => { const st = find(S.sel); if (!st) return; commit(); st.paths = st.paths.filter((p) => p.id !== d.p); renderCanvas(); renderSheet(); },
  settle: (d) => {
    const st = find(S.sel), o = st && st.open[+d.i], v = d.v;
    if (!o) return;
    if (o.k === "gap" && v === "Build a skill") return ask("Build a skill for this", st.id);
    if (o.k === "tail") {
      commit();
      const at = locate(st.id), tail = at.list.splice(at.index + 1);
      if (v !== "Remove them") { const q = st.paths[o.opts.indexOf(v)], z = q.steps[q.steps.length - 1], stop = z && z.kind === "stop" ? q.steps.pop() : null; q.steps.push(...tail); if (stop && !pathEnds(q)) q.steps.push(stop); }
      S.try = null; renderCanvas(); renderBar(); renderSheet();
      return;
    }
    if (o.k === "unsure" || o.k === "price") { if (/^Add a decision/.test(v)) return ACT.adddecision({ id: st.id, offer: o.k }); }
    commit();
    o.done = v;
    if (o.f) st[o.f] = v;
    if (o.k === "gap") { st.gap = v !== "Keep a person"; if (v === "Needs code") toast("Request filed in the Dev queue. A person does it until it ships."); }
    if (o.k === "gmail" && v === "Send by text instead") { st.part = "Texts · send text"; st.tool = "Texts"; }
    renderCanvas(); renderBar(); renderSheet();
  },
  reopen: (d) => { const st = find(S.sel); if (!st || !st.open[+d.i]) return; commit(); st.open[+d.i].done = null; renderCanvas(); renderBar(); renderSheet(); },
  nextopen: () => { const n = allOpen().find((x) => x.st.id !== S.sel) || allOpen()[0]; if (!n) return; S.sel = n.st.id; S.sheet = { type: "step" }; renderCanvas(); renderSheet(); const el = document.querySelector(`.node[data-id="${n.st.id}"]`); if (el) el.scrollIntoView({ block: "center", behavior: calm ? "auto" : "smooth" }); },
  try: () => { if (!S.building) startTry(); },
  endtry: () => { S.try = null; renderCanvas(); },
  adddecision: (d) => {
    const at = locate(d.id);
    if (!at) return;
    commit();
    const dec = d.offer === "price" ? decisionFrom("a price is up more than 5%", "ask Dana to approve the new price") : decisionFrom("a line is unsure", "ask Dana which item it is");
    at.list.splice(at.index + 1, 0, dec);
    fresh.add(dec.id);
    (at.list[at.index].open || []).forEach((o) => { if (o.k === d.offer) o.done = "A decision was added after it."; });
    S.chat.push({ text: `Added a decision after “${at.list[at.index].name}” from what the try showed. Change its rule on the canvas.`, changes: [{ s: "+", t: `decision · ${dec.paths[0].name}` }, { s: "+", t: `person step · ${dec.paths[0].steps[0].name}` }], h: S.hist.length });
    startTry();
  },
  fixwith: (d) => { S.sel = d.id; S.sheet = { type: "step" }; renderCanvas(); renderSheet(); const s = $("#say"); if (s) { s.placeholder = "What should it have done on this example?"; s.focus(); } },
  golive: () => { S.live = true; S.sheet = null; renderAll(); toast(`Published v1. The trial started at ${CLIENT}.`); },
};
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]");
  if (S.menu && !e.target.closest("#menu") && !(a && a.dataset.act === "plus")) { S.menu = null; renderMenu(); }
  if (!a || a.disabled) return;
  if (dragged && (a.dataset.act === "open" || a.dataset.act === "paladd")) return;
  ACT[a.dataset.act] && ACT[a.dataset.act](a.dataset, a, e);
});
let pend = null;
document.addEventListener("focusin", (e) => { if (e.target.dataset && e.target.dataset.f) pend = snap(); });
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "swhen") { S.start.name = t.value; return; }
  if (t.id === "para") { S.para = t.value; return; }
  const ds = t.dataset || {};
  if (ds.row) {
    const r = S.list.find((x) => x.id === ds.row);
    r.text = t.value;
    const im = t.value.match(/^if\s+(.*)$/i);
    if (im) { const i = S.list.indexOf(r), full = rowFrom(t.value), d = full.t === "decision" ? full : decRow(im[1], ""); S.list.splice(i, 1, d); renderList(d.paths[0].steps[0].text ? `[data-sub="${d.id}|0|0"]` : `[data-cond="${d.id}|0"]`); return; }
    const pk = $("#pk-" + r.id); if (pk) pk.outerHTML = kindPill(r.text, r.id);
    return;
  }
  if (ds.cond) { const k = ds.cond.split("|"); S.list.find((x) => x.id === k[0]).paths[+k[1]].cond = t.value; return; }
  if (ds.sub) { const k = ds.sub.split("|"), x = subList(ds.sub).list[+k[2]]; x.text = t.value; const pk = $("#pk-" + x.id); if (pk) pk.outerHTML = kindPill(x.text, x.id); return; }
  if (t.id === "aname" || t.id === "aname2") { S.name = t.value; return; }
  if (t.id === "say") { t.style.height = "auto"; t.style.height = Math.min(120, t.scrollHeight) + "px"; return; }
  if (!t.dataset.f) return;
  const st = find(S.sel);
  if (!st) return;
  if (t.dataset.p) { const p = st.paths.find((x) => x.id === t.dataset.p); if (t.dataset.r) p.rule[t.dataset.f] = t.value; else p[t.dataset.f] = t.value; }
  else {
    st[t.dataset.f] = t.value;
    if (t.dataset.f === "part" && st.kind !== "skill") { st.tool = t.value.split(" · ")[0]; st.open = (st.open || []).filter((o) => o.k !== "gmail"); if (st.tool === "Gmail") st.open.push(gmailIssue()); }
    if (t.dataset.f === "who") (st.open || []).forEach((o) => { if (o.k === "who") o.done = t.value; });
  }
  renderCanvas(); renderBar();
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "tryfile" && t.files[0]) { S.file = t.files[0].name; startTry(); return; }
  if (t.dataset && t.dataset.pend) { const [rid, pk] = t.dataset.pend.split("|"), r = S.list.find((x) => x.id === rid); if (pk === "o") r.oend = t.value; else r.paths[+pk].end = t.value; renderList(); return; }
  if (!t.dataset || !t.dataset.f) return;
  if (pend && pend !== snap()) { S.hist.push(pend); S.try = null; renderBar(); }
  pend = snap();
  if (t.dataset.re) renderSheet();
});
document.addEventListener("keydown", (e) => {
  const t = e.target, typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if (t.id === "say" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ACT.send(); return; }
  const ds = t.dataset || {};
  if (S.view === "steps" && (ds.row || ds.cond || ds.sub)) {
    if (e.key === "Enter") {
      e.preventDefault();
      if (ds.row) { const i = S.list.findIndex((x) => x.id === ds.row), r = row(); S.list.splice(i + 1, 0, r); renderList(`[data-row="${r.id}"]`); }
      else if (ds.cond) { const { list } = subList(ds.cond); if (!list.length) list.push(row()); renderList(`[data-sub="${ds.cond}|0"]`); }
      else { const k = ds.sub.split("|"), { list } = subList(ds.sub); list.splice(+k[2] + 1, 0, row()); renderList(`[data-sub="${k[0]}|${k[1]}|${+k[2] + 1}"]`); }
      return;
    }
    if (e.key === "Backspace" && !t.value && (ds.row || ds.sub)) {
      e.preventDefault();
      if (ds.row) { const i = S.list.findIndex((x) => x.id === ds.row), prev = S.list[i - 1]; S.list.splice(i, 1); renderList(prev && prev.t === "step" ? `[data-row="${prev.id}"]` : null); }
      else { const k = ds.sub.split("|"), { list } = subList(ds.sub); list.splice(+k[2], 1); renderList(+k[2] ? `[data-sub="${k[0]}|${k[1]}|${+k[2] - 1}"]` : `[data-cond="${k[0]}|${k[1] === "o" ? 0 : k[1]}"]`); }
      return;
    }
  }
  if (e.key === "Escape") { if (S.menu) { S.menu = null; renderMenu(); } else if (S.sheet) ACT.close(); return; }
  if ((e.key === "Enter" || e.key === " ") && (t.classList.contains("card") || t.classList.contains("block"))) { e.preventDefault(); t.click(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !typing && S.view === "build") { e.preventDefault(); undo(); }
});
document.addEventListener("paste", (e) => {
  const t = e.target, id = t.dataset && t.dataset.row, text = (e.clipboardData || { getData: () => "" }).getData("text");
  if (!id || !/\n/.test(text)) return;
  e.preventDefault();
  const lines = text.split("\n").filter((x) => clean(x)), i = S.list.findIndex((x) => x.id === id);
  S.list.splice(i, S.list[i].text.trim() ? 0 : 1, ...lines.map(rowFrom));
  renderList();
});
renderAll();
</script>
