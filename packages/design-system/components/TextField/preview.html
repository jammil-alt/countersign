<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>TextField</title></head>
<body>
<div class="ds-stack" style="padding:16px;max-width:420px">
<label class="ds-field"><span class="ds-label">Business name</span><input class="ds-input" placeholder="Hartley Millwork"></label>
<label class="ds-field"><span class="ds-label">Note for your lead <span class="ds-opt">optional</span></span><textarea class="ds-textarea" rows="2" placeholder="One or two sentences."></textarea></label>
<div class="ds-field"><span class="ds-label">Vendor email</span><input class="ds-input ds-input--error" value="orders@northside" aria-invalid="true"><span class="ds-error">Add the end of the address, like .com.</span></div>
</div>
</body>
