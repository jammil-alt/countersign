<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>SignCard</title></head>
<body>
<div style="padding:16px"><article class="mz-sign" style="max-width:600px"><div class="ds-row" style="justify-content:space-between"><span class="ds-pill ds-pill--warning">Waiting on you</span><span class="ds-eyebrow">Your Desk</span></div><h3 class="mz-sign__title">Four customers haven’t paid in 45 days.</h3><p class="mz-sign__body">We drafted the reminders. Sign and they go out today.</p><div class="mz-sign__change"><div class="mz-sign__side"><span class="ds-eyebrow">Before</span>No reminders sent since September.</div><div class="mz-sign__side"><span class="ds-eyebrow">After</span>Four reminders sent today, each with its invoice.</div></div><div class="mz-sign__receipts"><button class="mz-receipt"><img class="ds-icon" src="../../assets/Icons/mz-document.svg" width="14" height="14" alt="">Aging report</button><button class="mz-receipt"><img class="ds-icon" src="../../assets/Icons/mz-email.svg" width="14" height="14" alt="">4 drafts</button></div><div class="mz-sign__foot"><span class="mz-person mz-person--lead"><span class="ds-avatar ds-avatar--sm mz-lead">AN</span>Checked by Ana, your lead</span><span class="ds-row"><button class="ds-btn ds-btn--secondary">Ask a question</button><button class="ds-btn ds-btn--primary">Sign</button></span></div></article></div>
</body>
</html>
