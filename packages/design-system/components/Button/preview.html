<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Button</title></head>
<body>
<div class="ds-stack" style="padding:16px">
<div class="ds-row"><button class="ds-btn ds-btn--primary">Sign</button><button class="ds-btn ds-btn--secondary">Ask a question</button><button class="ds-btn ds-btn--ghost">Not now</button><button class="ds-btn ds-btn--link">See the worksheet</button><button class="ds-btn ds-btn--primary" disabled>Sign</button></div>
<div class="ds-row"><button class="ds-btn ds-btn--primary ds-btn--sm">Add a vendor</button><button class="ds-btn ds-btn--secondary ds-btn--sm"><img class="ds-icon" src="../../assets/Icons/mz-copy.svg" width="14" height="14" alt="">Copy as text</button><button class="ds-btn ds-btn--ghost ds-btn--sm">Skip</button></div>
<div class="ds-row"><button class="ds-btn ds-btn--ghost ds-btn--icon ds-btn--sm" title="Add"><img class="ds-icon" src="../../assets/Icons/mz-add.svg" width="16" height="16" alt=""></button><button class="ds-btn ds-btn--ghost ds-btn--icon ds-btn--sm" title="Collapse sidebar"><img class="ds-icon" src="../../assets/Icons/mz-sidebar.svg" width="16" height="16" alt=""></button><button class="ds-btn ds-btn--ghost ds-btn--icon" title="Close"><img class="ds-icon" src="../../assets/Icons/mz-close.svg" width="16" height="16" alt=""></button><button class="ds-btn ds-btn--secondary ds-btn--icon" title="More"><img class="ds-icon" src="../../assets/Icons/mz-more.svg" width="16" height="16" alt=""></button></div>
</div>
</body>
</html>
