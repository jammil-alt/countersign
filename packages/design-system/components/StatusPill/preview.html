<!-- @dsCard group="Status" height=170 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>StatusPill</title></head>
<body>
<div class="ds-stack" style="padding:16px">
<div class="ds-row"><span class="ds-pill ds-pill--neutral">Draft</span><span class="ds-pill ds-pill--neutral">Not started</span><span class="ds-help">neutral — nothing happened yet</span></div>
<div class="ds-row"><span class="ds-pill ds-pill--accent">In progress</span><span class="ds-pill ds-pill--accent">Checking</span><span class="ds-help">accent (slate) — the team is on it</span></div>
<div class="ds-row"><span class="ds-pill ds-pill--positive">Signed</span><span class="ds-pill ds-pill--positive">Paid</span><span class="ds-help">positive — done or confirmed</span></div>
<div class="ds-row"><span class="ds-pill ds-pill--warning">Waiting on you</span><span class="ds-pill ds-pill--warning">Up 12%</span><span class="ds-help">warning (signal) — needs you or changed</span></div>
</div>
</body>
</html>
