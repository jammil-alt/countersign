<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Checkbox</title></head>
<body>
<div class="ds-stack" style="padding:16px"><button class="ds-choice" role="checkbox" aria-checked="true"><span class="ds-check">✓</span>Send me The Weekly Table every Monday</button><button class="ds-choice" role="checkbox" aria-checked="false"><span class="ds-check"></span>Copy my bookkeeper on reminders</button></div>
<script>
document.querySelectorAll('[role=checkbox],[role=switch]').forEach(function(b){b.addEventListener('click',function(){b.setAttribute('aria-checked',b.getAttribute('aria-checked')==='true'?'false':'true');var m=b.querySelector('.ds-check');if(m)m.textContent=b.getAttribute('aria-checked')==='true'?'✓':'';});});
document.querySelectorAll('[role=radio]').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('[role=radio]').forEach(function(o){o.setAttribute('aria-checked',o===b?'true':'false');});});});
</script>
</body>
</html>
