name: Checks

# The whole gate in one place, so a pull request and a merge to main run exactly the same thing.
# Called by ci.yml and deploy.yml (callers pass `secrets: inherit`).
#
# Two jobs side by side: `static` (lint, layering, typecheck) and `test` (the database and the tests).
# Pull requests test only what they touch (`scope: affected`): the changed packages and every package
# that depends on them (pnpm's `...[base]` filter), or everything when a shared file changed (the
# root package.json, the lockfile, tsconfig, scripts, fixtures, workflows); a change to docs and
# Markdown alone runs no tests. Pushes to main and deploys always run everything.
#
# The database: a Postgres 16 + pgvector service container (the same image as docker-compose.yml),
# set up with Neon's roles by scripts/setup-postgres.sh, which also applies every migration from
# scratch. The runner's own Postgres has no pgvector package, so it isn't used.
#
# CI never connects to Neon (docs/plan.md §1.35): a copy of production would put client data (it may
# hold health or card data) on a runner, and Neon refuses schema-only branches on this project (its
# SQL-made `cs_runtime` role counts as a "legacy web access role"). Migrations meet real rows on
# staging first: deploy.yml migrates staging, in a transaction, before its Worker deploys, and
# production only after that.

on:
  workflow_call:
    inputs:
      scope:
        description: "`all` runs every package's tests; `affected` (pull requests) runs only the packages the change touches and those that depend on them."
        type: string
        default: all
      base:
        description: The branch a pull request merges into, for `affected`.
        type: string
        default: main

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm lint:deps

      - run: pnpm typecheck

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so `affected` can diff against the base branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: What to test
        id: scope
        env:
          SCOPE: ${{ inputs.scope }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" != "affected" ]; then
            echo "tests=all" >> "$GITHUB_OUTPUT"; echo "Testing everything."; exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          printf 'Changed:\n%s\n' "$changed"
          code=$(echo "$changed" | grep -vE '^docs/|\.md$' || true)
          shared=$(echo "$code" | grep -vE '^(apps|packages|packs)/' || true)
          if [ -z "$code" ]; then
            echo "tests=none" >> "$GITHUB_OUTPUT"; echo "Docs and Markdown only: no tests."
          elif [ -n "$shared" ]; then
            echo "tests=all" >> "$GITHUB_OUTPUT"; printf 'Shared files changed, testing everything:\n%s\n' "$shared"
          else
            echo "tests=affected" >> "$GITHUB_OUTPUT"; echo "Testing the changed packages and their dependents."
          fi

      # The browser connector's tests drive real Chromium through Playwright (docs/plan.md §1.26,
      # phase 3). Installed with apps/api's own Playwright, so the browser always matches its
      # version; skipped where apps/api has no Playwright yet.
      - name: Chromium for the browser tests
        if: steps.scope.outputs.tests != 'none'
        run: |
          set -euo pipefail
          if [ -d apps/api/node_modules/playwright ]; then
            pnpm --filter @countersign/api exec playwright install --with-deps chromium
          else
            echo "apps/api has no Playwright: nothing to install."
          fi

      - name: A local Postgres with Neon's roles
        if: steps.scope.outputs.tests != 'none'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          url=$(scripts/setup-postgres.sh)
          echo "::add-mask::$url"
          echo "DIRECT_DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "TEST_ADMIN_DATABASE_URL=postgres://postgres:ci@localhost:5432/postgres" >> "$GITHUB_ENV"

      - name: Tests (everything)
        if: steps.scope.outputs.tests == 'all'
        run: pnpm test
        env:
          LLM_MODE: replay

      - name: Tests (changed packages and their dependents)
        if: steps.scope.outputs.tests == 'affected'
        run: pnpm --filter "...[origin/${{ inputs.base }}]" test
        env:
          LLM_MODE: replay
