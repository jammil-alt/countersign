name: Checks

# The whole gate in one place, so a pull request and a merge to main run exactly the same thing.
# Called by ci.yml and deploy.yml (callers pass `secrets: inherit`).
#
# Two jobs side by side: `static` (lint, layering, typecheck) and `test` (the database and the tests).
# Pull requests test only what they touch (`scope: affected`): the changed packages and every package
# that depends on them (pnpm's `...[base]` filter), or everything when a shared file changed (the
# root package.json, the lockfile, tsconfig, scripts, fixtures, workflows); a change to docs and
# Markdown alone runs no tests. Pushes to main and deploys always run everything.
#
# The database: a Postgres 16 + pgvector service container (the same image as docker-compose.yml),
# set up with Neon's roles by scripts/setup-postgres.sh, which also applies every migration from
# scratch. The runner's own Postgres has no pgvector package, so it isn't used.
#
# CI never connects to Neon (docs/plan.md §1.35): a copy of production would put client data (it may
# hold health or card data) on a runner, and Neon refuses schema-only branches on this project (its
# SQL-made `cs_runtime` role counts as a "legacy web access role"). Migrations meet real rows on
# staging first: deploy.yml migrates staging, in a transaction, before its Worker deploys, and
# production only after that.

on:
  workflow_call:
    inputs:
      scope:
        description: "`all` runs every package's tests; `affected` (pull requests) runs only the packages the change touches and those that depend on them."
        type: string
        default: all
      base:
        description: The branch a pull request merges into, for `affected`.
        type: string
        default: main

# The jobs only read the repository; nothing here writes to GitHub.
permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (third-party: pinned to a commit)

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm lint:deps

      - run: pnpm typecheck

      # The web app's first load against its budget (scripts/web-size.mjs, docs/audit-plan.md 9.6),
      # so it can't grow unnoticed. The budget is set in the script. Built with a DSN, as deploy.yml
      # builds it: Sentry is in the first load only when the build has one. A made-up public DSN on
      # an unused address; this build is measured, never served.
      # --manifest writes dist/.vite/manifest.json, the chunk graph the script reads.
      - run: pnpm --filter @countersign/web build --manifest
        env:
          VITE_SENTRY_DSN: https://0@o0.ingest.sentry.io/0

      - run: pnpm size:web

  check:
    runs-on: ubuntu-latest
    # A full run takes about 8 minutes (2026-11-08); the limit leaves room for a slow runner.
    timeout-minutes: 30
    # A database test whose server is unreachable fails here instead of skipping
    # (packages/db/src/testing.ts), so a broken service container can't pass as green.
    env:
      COUNTERSIGN_REQUIRE_DB: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so `affected` can diff against the base branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (third-party: pinned to a commit)

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: What to test
        id: scope
        env:
          SCOPE: ${{ inputs.scope }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" != "affected" ]; then
            echo "tests=all" >> "$GITHUB_OUTPUT"; echo "Testing everything."; exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          printf 'Changed:\n%s\n' "$changed"
          code=$(echo "$changed" | grep -vE '^docs/|\.md$' || true)
          shared=$(echo "$code" | grep -vE '^(apps|packages|packs)/' || true)
          if [ -z "$code" ]; then
            echo "tests=none" >> "$GITHUB_OUTPUT"; echo "Docs and Markdown only: no tests."
          elif [ -n "$shared" ]; then
            echo "tests=all" >> "$GITHUB_OUTPUT"; printf 'Shared files changed, testing everything:\n%s\n' "$shared"
          else
            echo "tests=affected" >> "$GITHUB_OUTPUT"; echo "Testing the changed packages and their dependents."
          fi

      # The browser connector's tests drive real Chromium through Playwright (docs/plan.md §1.26,
      # phase 3). Installed with apps/api's own Playwright, so the browser always matches its
      # version; skipped where apps/api has no Playwright yet.
      - name: Chromium for the browser tests
        if: steps.scope.outputs.tests != 'none'
        run: |
          set -euo pipefail
          if [ -d apps/api/node_modules/playwright ]; then
            # The runner image already has Chromium's libraries; --with-deps adds fonts from the
            # Ubuntu mirrors. When the mirrors can't be reached, go on with the browser alone: no
            # test compares pixels, so the fonts change no result.
            timeout 300 pnpm --filter @countersign/api exec playwright install --with-deps chromium \
              || pnpm --filter @countersign/api exec playwright install chromium
          else
            echo "apps/api has no Playwright: nothing to install."
          fi

      - name: A local Postgres with Neon's roles
        if: steps.scope.outputs.tests != 'none'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          url=$(scripts/setup-postgres.sh)
          echo "::add-mask::$url"
          echo "DIRECT_DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "TEST_ADMIN_DATABASE_URL=postgres://postgres:ci@localhost:5432/postgres" >> "$GITHUB_ENV"

      - name: Tests (everything)
        if: steps.scope.outputs.tests == 'all'
        run: pnpm test
        env:
          LLM_MODE: replay

      # `!countersign` leaves out the repo root: a change to a root file (CLAUDE.md, docs/) selects
      # it, and its own `test` is `pnpm -r test`, which ran every package a second time alongside
      # these, on the same database (14-16 minute runs on 2026-11-08). Root files that aren't docs
      # already test everything (`What to test` above).
      - name: Tests (changed packages and their dependents)
        if: steps.scope.outputs.tests == 'affected'
        run: pnpm --filter "...[origin/${{ inputs.base }}]" --filter '!countersign' test
        env:
          LLM_MODE: replay

  # The screens in a real browser (apps/web/e2e/route-sweep.mjs, docs/operations.md §2): the seeded
  # database, the built app on `wrangler dev` with the dev sign-in, every screen of the back office
  # and the portal opened and checked for a crash, a page error, a console error or an /api 5xx.
  # Skipped for docs-only pull requests.
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Docs only?
        id: scope
        env:
          SCOPE: ${{ inputs.scope }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" = "affected" ] && \
            [ -z "$(git diff --name-only "origin/$BASE...HEAD" | grep -vE '^docs/|\.md$' || true)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Docs and Markdown only: no sweep."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (third-party: pinned to a commit)
        if: steps.scope.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # As above: the fonts from the Ubuntu mirrors when they can be reached, the browser alone when
      # not. The sweep saves screenshots; it compares none.
      - name: Chromium
        if: steps.scope.outputs.run == 'true'
        run: |
          timeout 300 pnpm --filter @countersign/web exec playwright install --with-deps chromium \
            || pnpm --filter @countersign/web exec playwright install chromium

      # The local passwords .env.example expects, so `wrangler dev` reads it as it is. SEED_E2E=1
      # also seeds the Desk item the walkthroughs sign and undo (never set on staging).
      - name: A seeded Postgres with Neon's roles
        if: steps.scope.outputs.run == 'true'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci
          CS_OWNER_PASSWORD: cs_owner
          CS_WORKER_PASSWORD: cs_worker
          SEED_E2E: "1"
        run: scripts/setup-postgres.sh > /dev/null

      - name: The app on wrangler dev
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          cp .env.example .env
          pnpm --filter @countersign/web build
          (cd apps/api && nohup pnpm exec wrangler dev --env-file ../../.env --ip 127.0.0.1 \
            --port 8787 > "$RUNNER_TEMP/wrangler.log" 2>&1 &)
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:8787/api/health > /dev/null && exit 0
            sleep 2
          done
          echo "::error::wrangler dev did not answer"; tail -50 "$RUNNER_TEMP/wrangler.log"; exit 1

      - name: Sweep every screen
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @countersign/web sweep

      - name: The Worker's log
        if: failure() && steps.scope.outputs.run == 'true'
        run: tail -200 "$RUNNER_TEMP/wrangler.log"
