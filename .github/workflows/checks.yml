name: Checks

# The whole gate in one place, so a pull request and a merge to main run exactly the same thing.
# Called by ci.yml and deploy.yml (callers pass `secrets: inherit`).
#
# Two jobs side by side: `static` (lint, layering, typecheck) and `test` (the database and the tests).
# Pull requests test only what they touch (`scope: affected`): the changed packages and every package
# that depends on them (pnpm's `...[base]` filter), or everything when a shared file changed (the
# root package.json, the lockfile, tsconfig, scripts, fixtures, workflows); a change to docs and
# Markdown alone runs no tests. Pushes to main and deploys always run everything.
#
# Two databases, as in Plenary Labs:
#  - A Postgres 16 + pgvector service container (the same image as docker-compose.yml), set up with
#    Neon's roles by scripts/setup-postgres.sh, is what the tests run against (fast: no network round
#    trips). The runner's own Postgres has no pgvector package, so it isn't used.
#  - A throwaway Neon branch copied from `main` checks that migrations apply to production's real
#    schema and data. Skipped until the NEON_API_KEY secret and NEON_PROJECT_ID variable exist.

on:
  workflow_call:
    inputs:
      neon-parent:
        description: Neon branch the throwaway branch is copied from.
        type: string
        default: main
      scope:
        description: "`all` runs every package's tests; `affected` (pull requests) runs only the packages the change touches and those that depend on them."
        type: string
        default: all
      base:
        description: The branch a pull request merges into, for `affected`.
        type: string
        default: main

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm lint:deps

      - run: pnpm typecheck

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH: ci-run${{ github.run_id }}-${{ github.run_attempt }}
      NEONCTL: neonctl@4
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so `affected` can diff against the base branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: What to test
        id: scope
        env:
          SCOPE: ${{ inputs.scope }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" != "affected" ]; then
            echo "tests=all" >> "$GITHUB_OUTPUT"; echo "Testing everything."; exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          printf 'Changed:\n%s\n' "$changed"
          code=$(echo "$changed" | grep -vE '^docs/|\.md$' || true)
          shared=$(echo "$code" | grep -vE '^(apps|packages|packs)/' || true)
          if [ -z "$code" ]; then
            echo "tests=none" >> "$GITHUB_OUTPUT"; echo "Docs and Markdown only: no tests."
          elif [ -n "$shared" ]; then
            echo "tests=all" >> "$GITHUB_OUTPUT"; printf 'Shared files changed, testing everything:\n%s\n' "$shared"
          else
            echo "tests=affected" >> "$GITHUB_OUTPUT"; echo "Testing the changed packages and their dependents."
          fi

      # The browser connector's tests drive real Chromium through Playwright (docs/plan.md §1.26,
      # phase 3). Installed with apps/api's own Playwright, so the browser always matches its
      # version; skipped where apps/api has no Playwright yet.
      - name: Chromium for the browser tests
        if: steps.scope.outputs.tests != 'none'
        run: |
          set -euo pipefail
          if [ -d apps/api/node_modules/playwright ]; then
            pnpm --filter @countersign/api exec playwright install --with-deps chromium
          else
            echo "apps/api has no Playwright: nothing to install."
          fi

      - name: A local Postgres with Neon's roles
        if: steps.scope.outputs.tests != 'none'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          url=$(scripts/setup-postgres.sh)
          echo "::add-mask::$url"
          echo "DIRECT_DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "TEST_ADMIN_DATABASE_URL=postgres://postgres:ci@localhost:5432/postgres" >> "$GITHUB_ENV"

      - name: Tests (everything)
        if: steps.scope.outputs.tests == 'all'
        run: pnpm test
        env:
          LLM_MODE: replay

      - name: Tests (changed packages and their dependents)
        if: steps.scope.outputs.tests == 'affected'
        run: pnpm --filter "...[origin/${{ inputs.base }}]" test
        env:
          LLM_MODE: replay

      - name: Create a Neon branch for this run
        id: neon
        if: env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != ''
        run: |
          set -euo pipefail
          npx --yes "$NEONCTL" branches create --project-id "$NEON_PROJECT_ID" \
            --name "$NEON_BRANCH" --parent '${{ inputs.neon-parent }}' --output json > /dev/null
          echo "created=true" >> "$GITHUB_OUTPUT"
          url=$(npx --yes "$NEONCTL" connection-string "$NEON_BRANCH" \
            --project-id "$NEON_PROJECT_ID" --role-name cs_owner --database-name countersign)
          echo "::add-mask::$url"
          echo "NEON_DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Migrations apply to a copy of production
        if: env.NEON_DATABASE_URL != ''
        run: DIRECT_DATABASE_URL="$NEON_DATABASE_URL" pnpm --filter @countersign/db run --if-present db:migrate

      - name: Delete the Neon branch
        if: always() && steps.neon.outputs.created == 'true'
        run: npx --yes "$NEONCTL" branches delete "$NEON_BRANCH" --project-id "$NEON_PROJECT_ID"
