name: CI

# Every pull request that is not a draft, and a manual run for any branch. Pushes to main are
# checked by deploy.yml. Same arrangement as Plenary Labs: work-in-progress PRs are drafts and
# cost no Actions minutes; marking one ready runs the whole check, and every push after that.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A run for a draft does nothing (the job below is skipped), so it gets a group of its own: a push
# and "ready for review" can arrive out of order, and a late draft run must never cancel the real one.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/checks.yml
    secrets: inherit
    with:
      # Pull requests test what they touch; a manual run tests everything.
      scope: ${{ github.event_name == 'pull_request' && 'affected' || 'all' }}
      base: ${{ github.base_ref || 'main' }}
