name: CodeQL

# Static analysis for security bugs (SOC 2 CC7.1, PCI DSS 6.2.3 and 6.3): every pull request that
# is ready for review, every push to main, and once a week so new queries see old code. Findings
# appear under Security → Code scanning; a high-severity one should block the merge (set it in the
# branch protection rule for main).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
      # The findings in this run's log too (rule, severity, file:line), so whoever reads the job's
      # log sees what an alert is about without the Security tab. Messages are CodeQL's own text.
      - name: Findings
        if: always()
        run: |
          shopt -s nullglob
          files=(codeql-results/*.sarif)
          [ ${#files[@]} -gt 0 ] || { echo "No SARIF output."; exit 0; }
          for f in "${files[@]}"; do
            jq -r '
              .runs[] as $run
              | [$run.tool.driver.rules[]?, $run.tool.extensions[]?.rules[]?] as $rules
              | $run.results[]?
              | . as $r
              | ((first($rules[] | select(.id == $r.ruleId)) | .properties["security-severity"]) // "-") as $sev
              | "\($r.ruleId)\tseverity=\($sev)\t\($r.locations[0].physicalLocation.artifactLocation.uri):\($r.locations[0].physicalLocation.region.startLine)\t\($r.message.text | gsub("\n"; " ") | .[0:200])"
            ' "$f"
          done | sort | tee codeql-findings.txt
          echo "Findings: $(wc -l < codeql-findings.txt)"

