name: Deploy

# main → staging on every push (docs-only pushes ride along with the next deploy). Production by a
# `v*` tag or a manual run. Each deploy runs the full check, migrates the target's Neon branch as
# cs_owner, then `wrangler deploy` from apps/api. Inert until the secrets in docs/operations.md §1
# exist, and until apps/api has a wrangler.jsonc (M0).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub environments "staging" and "production" hold the Worker's per-environment secrets
    # (WORKOS_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY); repository secrets stay available too.
    environment: ${{ github.event.inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
    env:
      TARGET: ${{ github.event.inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Ready to deploy?
        id: ready
        run: |
          missing=()
          for name in NEON_API_KEY NEON_PROJECT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          [ -f apps/api/wrangler.jsonc ] || missing+=("apps/api/wrangler.jsonc")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped, missing: ${missing[*]}. See docs/operations.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.ready.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.ready.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Migrate the target's Neon branch
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          branch=$([ "$TARGET" = production ] && echo main || echo staging)
          url=$(npx --yes neonctl@4 connection-string "$branch" \
            --project-id "$NEON_PROJECT_ID" --role-name cs_owner --database-name countersign)
          echo "::add-mask::$url"
          DIRECT_DATABASE_URL="$url" pnpm --filter @countersign/db run --if-present db:migrate

      # Error tracking (apps/web/src/observability.ts): the browser's Sentry DSN and the commit as
      # its release. The DSN is not a secret (it ships in the page); a repository variable or a
      # secret both work. Unset leaves Sentry off in the browser.
      - name: Build the web app
        if: steps.ready.outputs.ready == 'true'
        env:
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB || secrets.SENTRY_DSN_WEB }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_SOURCEMAPS: ${{ secrets.SENTRY_AUTH_TOKEN != '' && '1' || '' }}
        run: pnpm --filter @countersign/web run --if-present build

      # Readable browser stack traces in Sentry: upload the web build's source maps for this
      # release, then delete them so they are never served. A notice or a warning, never a failure.
      - name: Web source maps to Sentry
        if: steps.ready.outputs.ready == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'twelve-thirty-four-consulting' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_WEB || 'mezonas-web' }}
        run: |
          set -euo pipefail
          if [ -n "$SENTRY_AUTH_TOKEN" ] && ls apps/web/dist/assets/*.map > /dev/null 2>&1; then
            npx --yes @sentry/cli@3.6.2 sourcemaps inject apps/web/dist/assets
            npx --yes @sentry/cli@3.6.2 sourcemaps upload --release "$GITHUB_SHA" apps/web/dist/assets \
              || echo "::warning::Web source maps were not uploaded to Sentry; browser errors will show minified stack traces"
          else
            echo "::notice::No SENTRY_AUTH_TOKEN or no source maps: web source maps not uploaded"
          fi
          find apps/web/dist -name '*.map' -delete

      # Always an explicit environment: the top level of wrangler.jsonc is local development (dev
      # sign-in) and must never be deployed.
      #
      # `--var` adds plain-text vars to the ones in wrangler.jsonc: the Worker's Sentry DSN (unset
      # leaves Sentry off; apps/api/src/observability/sentry.ts) and the commit, Sentry's release.
      # `--outdir dist --upload-source-maps` keeps the deployed bundle and its map in apps/api/dist
      # for the next step, and gives Cloudflare the map.
      - name: Deploy the Worker
        if: steps.ready.outputs.ready == 'true'
        env:
          SENTRY_DSN_API: ${{ vars.SENTRY_DSN_API || secrets.SENTRY_DSN_API }}
        run: |
          set -euo pipefail
          env_flag=$([ "$TARGET" = production ] && echo '--env=production' || echo '--env=staging')
          args=("$env_flag" --var "DEPLOYED_SHA:$GITHUB_SHA" --outdir dist --upload-source-maps)
          [ -z "$SENTRY_DSN_API" ] || args+=(--var "SENTRY_DSN:$SENTRY_DSN_API")
          pnpm --filter @countersign/api exec wrangler deploy "${args[@]}"

      # Readable Worker stack traces in Sentry: the deployed bundle's map, for this release.
      - name: Worker source maps to Sentry
        if: steps.ready.outputs.ready == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'twelve-thirty-four-consulting' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_API || 'mezonas-api' }}
        run: |
          set -euo pipefail
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -f apps/api/dist/worker.js.map ]; then
            npx --yes @sentry/cli@3.6.2 sourcemaps upload --release "$GITHUB_SHA" \
              --strip-prefix 'apps/api/dist/..' apps/api/dist \
              || echo "::warning::Worker source maps were not uploaded to Sentry; API errors will show bundled stack traces"
          else
            echo "::notice::No SENTRY_AUTH_TOKEN or no Worker source map: Worker source maps not uploaded"
          fi

      - name: Worker secrets
        if: steps.ready.outputs.ready == 'true'
        working-directory: apps/api
        run: |
          set -euo pipefail
          env_name=$([ "$TARGET" = production ] && echo production || echo staging)
          put() { printf '%s' "$2" | pnpm exec wrangler secret put "$1" --env "$env_name" > /dev/null; echo "set $1"; }
          # Copied from the GitHub environment's secrets on every deploy, so a rotated key takes effect.
          if [ -n "${WORKOS_API_KEY:-}" ]; then put WORKOS_API_KEY "$WORKOS_API_KEY"; fi
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then put ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"; fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then put OPENAI_API_KEY "$OPENAI_API_KEY"; fi
          # Generated once inside Cloudflare and never shown or stored anywhere else. If the list of
          # existing secrets can't be read, this step fails (set -e) rather than risk replacing
          # ENCRYPTION_KEY, which would make stored connection credentials unreadable.
          existing=$(pnpm exec wrangler secret list --env "$env_name" --format json | jq -r '.[].name')
          for name in ENCRYPTION_KEY WORKOS_COOKIE_PASSWORD; do
            if grep -qx "$name" <<<"$existing"; then echo "$name already set"; continue; fi
            if [ "$name" = ENCRYPTION_KEY ]; then value=$(openssl rand -base64 32); else value=$(openssl rand -hex 32); fi
            echo "::add-mask::$value"
            put "$name" "$value"
          done
