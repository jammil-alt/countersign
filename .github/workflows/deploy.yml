name: Deploy

# main → staging on every push (docs-only pushes ride along with the next deploy). Production by a
# `v*` tag or a manual run. Each deploy runs checks.yml and deploy-app.yml, which migrates the target's
# Neon branch as cs_owner, deploys the code service (apps/mfa, Worker mezonas-codes) and its
# secrets, then the browser service (apps/browser, Worker mezonas-browser), then `wrangler deploy`
# from apps/api, whose `CODES` and `BROWSER` service bindings need both to exist.
# Staging takes the fast route (docs/operations.md, "Staging: the fast route"): its deploy doesn't
# wait for checks.yml, which runs beside it in the same run (`static` alone when the merged pull
# request's CI already passed the tests and the screen sweep: the `tested` job), and it copies the
# secrets only when run by hand or when the push changes how they are copied.
# Production takes the full route: every check on the tagged commit first, and only a commit that
# staging has run with a passing smoke test (the `staged` job).
# Any branch can go to staging by hand, without merging: quick-deploy.yml.
# The public site (apps/site, Worker mezonas-site, mezonas.com) deploys in its own job, from main only.
# Inert until the secrets in docs/operations.md §1 exist, and until apps/api has a wrangler.jsonc (M0).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

# Deploys to one target queue, never cancel: a second push that cancelled a running deploy could stop
# it between the migration and the Worker, leaving the new schema under the old Worker for good.
# The group is held by the deploy jobs (`deploy-<target>`), not the whole run, so the checks running
# beside a staging deploy never hold up the next one. GitHub keeps one waiting job per group, so a
# burst of pushes still deploys only the newest. quick-deploy.yml's deploy job holds the same
# `deploy-staging` group, for the same reason; a waiting quick deploy and a waiting deploy from main
# replace each other, the newest kept.

jobs:
  # Whether a staging deploy can skip the tests and the screen sweep because the pull request's CI
  # already passed them. Only for a push to main that added exactly one merge commit (its first
  # parent is main before the push) whose second parent, the pull request's head, has successful
  # `checks / check` and `checks / sweep` check runs from GitHub Actions (ci.yml's jobs). Anything
  # else runs them as before: a tag or a manual run, a direct push, a squash or rebase merge, a
  # merge before the pull request's CI finished, a failed or missing CI, an API that doesn't answer.
  # Accepted for staging (owner, 2026-11-17): CI tested the pull request's head merged with main as
  # it was then, and only the packages it touched (`scope: affected`), not this merge commit; two
  # pull requests that each passed can reach staging together untested. Production runs everything.
  # Never fails: on any error it says "run the tests".
  tested:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      skip: ${{ steps.look.outputs.skip }}
      secrets: ${{ steps.secrets.outputs.copy }}
    steps:
      - id: look
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          TARGET: ${{ github.event.inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
        run: |
          set -euo pipefail
          decide() {
            echo "skip=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            printf '### Before the deploy\n\n%s\n' "$2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          full="The full checks run (tests and screen sweep)"
          if [ "$TARGET" != staging ] || [ "$EVENT" != push ] || [ "$REF" != refs/heads/main ]; then
            decide false "$full: not a push to main ($EVENT, $REF, $TARGET)."
          fi
          parents=$(timeout 60 gh api "repos/$REPO/commits/$SHA" --jq '[.parents[].sha] | join(" ")') ||
            decide false "$full: the commit's parents could not be read."
          read -r first second extra <<<"$parents" || true
          if [ -z "${second:-}" ] || [ -n "${extra:-}" ]; then
            decide false "$full: $SHA is not a merge commit with two parents (a direct push, or a squash or rebase merge)."
          fi
          if [ "$first" != "$BEFORE" ]; then
            decide false "$full: the push added more than one merge commit to main ($BEFORE → $SHA)."
          fi
          for name in "checks / check" "checks / sweep"; do
            # filter=latest: a re-run's result replaces the first one's.
            conclusion=$(timeout 60 gh api -X GET "repos/$REPO/commits/$second/check-runs" \
              -f check_name="$name" -f filter=latest \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | (.conclusion // .status // "missing")') ||
              decide false "$full: the check runs of the pull request's head $second could not be read."
            if [ "$conclusion" != success ]; then
              decide false "$full: CI's \`$name\` on the pull request's head $second is ${conclusion:-missing}, not success."
            fi
          done
          decide true "Tests and screen sweep skipped: the merged pull request's CI passed \`checks / check\` and \`checks / sweep\` on its head $second. Lint, layering, typecheck and the web build run beside the deploy."

      # Whether the deploy copies the Workers' secrets. A staging deploy from a push copies none,
      # unless the push changes how they are copied (deploy-app.yml, which lists them, or
      # scripts/worker-secrets.sh): rotating a key, or adding one, is "update the GitHub secret, run
      # Actions → Deploy by hand". Production and runs by hand always copy them. Never fails: on any
      # error, or a comparison too long to trust, it says "copy".
      - id: secrets
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          copy() {
            echo "copy=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            printf '### Secrets\n\n%s\n' "$2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [ "$EVENT" != push ] || [ "$REF" != refs/heads/main ]; then
            copy true "Copied: not a push to main ($EVENT, $REF)."
          fi
          files=$(timeout 60 gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '[.files[].filename] | join("\n")') ||
            copy true "Copied: the push's changes could not be read."
          if [ "$(grep -c . <<<"$files")" -ge 300 ]; then
            copy true "Copied: the push changes 300 files or more, more than the comparison lists."
          fi
          if grep -qxE '\.github/workflows/deploy-app\.yml|scripts/worker-secrets\.sh' <<<"$files"; then
            copy true "Copied: the push changes how the secrets are copied."
          fi
          copy false "Not copied: a push to main that doesn't change how they are copied. Actions → Deploy → staging, run by hand, copies them."

  checks:
    needs: tested
    uses: ./.github/workflows/checks.yml
    secrets: inherit
    with:
      # Anything but a clear "skip" (an error, no answer) runs the tests.
      tests: ${{ needs.tested.outputs.skip != 'true' }}

  # Staging: deployed as soon as `tested` has answered, beside the checks, not after them. Nothing
  # the checks catch outlasts the next deploy; the migrations it applies are main's, which passed
  # the pull request's CI. A failed check marks the run failed, and production runs every check
  # again on the tagged commit.
  deploy-staging:
    needs: tested
    if: (github.event.inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging')) == 'staging'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-app.yml
    secrets: inherit
    with:
      target: staging
      # Anything but a clear "don't copy" (an error, no answer) copies them.
      secrets: ${{ needs.tested.outputs.secrets != 'false' }}

  # Production deploys only a commit staging has run with a passing smoke test: GitHub's record of
  # the `staging` environment's deployments of this commit (one per deploy job, success only when
  # the whole job passed, smoke test included). Fails closed: no record, or an API that doesn't
  # answer, stops the deploy. To go on, deploy that commit to staging first (Actions → Deploy → Run
  # workflow from the tag, target staging), then run this again.
  staged:
    if: (github.event.inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging')) == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v7

      - name: Staging ran this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The commit itself, also for an annotated tag.
          sha=$(git rev-parse 'HEAD^{commit}')
          ids=$(gh api -X GET "repos/$REPO/deployments" -f sha="$sha" -f environment=staging -f per_page=100 --jq '.[].id')
          for id in $ids; do
            if [ "$(gh api "repos/$REPO/deployments/$id/statuses?per_page=100" --jq 'any(.[]; .state == "success")')" = true ]; then
              echo "Staging ran $sha and passed its smoke test (deployment $id)."
              exit 0
            fi
          done
          message="Staging has not run $sha with a passing smoke test, so production won't. Deploy it to staging first (Actions → Deploy → Run workflow from this tag, target staging), then run this again."
          echo "::error title=Not deployed: not on staging yet::$message"
          printf '### Not deployed\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Production: after every check (the full checks always run for production) and `staged`.
  deploy-production:
    needs: [checks, staged]
    if: (github.event.inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging')) == 'production'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-app.yml
    secrets: inherit
    with:
      target: production

  # The public site, mezonas.com (apps/site, docs/plan.md §1.29): static files on the Worker
  # mezonas-site. One site for every environment, so it deploys from main only (a push, or a
  # manual run from main), never from a tag. Its own job: it needs no database or app secrets, and
  # a failure here never holds up the app's deploy.
  site:
    needs: checks
    if: github.ref == 'refs/heads/main'
    # One site deploy at a time (the run-wide group that did this is now on the deploy jobs).
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Ready to deploy?
        id: ready
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Site deploy skipped, missing: ${missing[*]}. See docs/operations.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (third-party: pinned to a commit)
        if: steps.ready.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.ready.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the site
        if: steps.ready.outputs.ready == 'true'
        run: pnpm --filter @countersign/site run build

      # Creates the custom domains mezonas.com and www.mezonas.com on first run. It fails while
      # another DNS record holds either name (docs/operations.md, "The public site").
      - name: Deploy the site
        if: steps.ready.outputs.ready == 'true'
        run: pnpm --filter @countersign/site exec wrangler deploy
